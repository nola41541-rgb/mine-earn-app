const API_URL = SUPABASE_URL + '/functions/v1/dynamic-action';
const AD_URL = SUPABASE_URL + '/functions/v1/dynamic-api';
const WD_URL = SUPABASE_URL + '/functions/v1/smart-worker';
// Phone clocks can be wrong, so timers use Telegram's server time (auth_date) as the reference
let CLOCK_OFFSET = 0;
function nowMs(){ return Date.now() + CLOCK_OFFSET; }
(function(){
  try{
    const ad = Number(window.Telegram.WebApp.initDataUnsafe.auth_date);
    if(ad > 0){
      const off = ad*1000 - Date.now();
      if(Math.abs(off) < 12*3600*1000) CLOCK_OFFSET = off;
    }
  }catch(e){}
})();
// After the server sets a fresh 30-minute timer, use it to correct the offset precisely
function calibrate(slot){
  if(slot && slot.endTime && slot.state==='mining'){
    const off = (Number(slot.endTime) - SESSION_MS) - Date.now();
    if(Math.abs(off) < 12*3600*1000) CLOCK_OFFSET = off;
  }
}
async function api(action, payload, url){
  const initData = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
  const res = await fetch(url || API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
    body: JSON.stringify(Object.assign({ action, initData }, payload || {}))
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function applyServerState(s){
  state.balance = s.balance;
  state.slots = s.slots;
  state.referralCount = s.referralCount;
  state.tasksCompleted = s.tasksCompleted;
}
async function loadState(){
  const r = await api('load');
  const s = r.state;
  s.slots.forEach(sl=>{ if(sl.state==='watching') sl.state='mining'; });
  return s;
}
// All saving now happens on the server; kept as a no-op so old calls are harmless
async function saveState(){}

function fmtTime(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}

// Monetag rewarded interstitial (zone 12030270)
function preloadAd(){
  try{
    if(typeof show_12030270==='function'){
      show_12030270({ type:'preload' }).catch(()=>{});
    }
  }catch(e){}
}
window.addEventListener('load', ()=>setTimeout(preloadAd, 1500));

// Resolves true only if the ad finished without error
async function watchAd(ymid){
  if(typeof show_12030270!=='function'){
    alert('Ads are not available right now. Please try again in a moment.');
    return false;
  }
  try{
    await show_12030270({ ymid:String(ymid) });
    preloadAd();
    return true;
  }catch(e){
    console.error('Ad error', e);
    alert('Ad failed or none is available right now. Please try again.');
    return false;
  }
}

async function handleCollect(i){
  const cfg = SLOT_CONFIG[i];
  const slot = state.slots[i];
  if(slot.state!=='ready') return;
  slot.state='watching';
  slot.adsWatched=0;
  render();
  const ymids = [];
  for(let a=0; a<cfg.ads; a++){
    let ymid = null;
    try{
      const r0 = await api('adStart');
      ymid = r0.ymid;
    }catch(e){
      alert(e.message);
      slot.state='ready';
      slot.adsWatched=0;
      render();
      return;
    }
    const watched = await watchAd(ymid);
    if(!watched){
      slot.state='ready';
      slot.adsWatched=0;
      render();
      return;
    }
    ymids.push(ymid);
    slot.adsWatched++;
    render();
  }
  let done = false, lastErr = '';
  for(let t=0; t<8 && !done; t++){
    try{
      const r = await api('collect', { i, ymids });
      applyServerState(r.state);
      calibrate(state.slots[i]);
      done = true;
    }catch(e){
      lastErr = e.message;
      if(lastErr.indexOf('not confirmed yet')===-1) break;
      await new Promise(res=>setTimeout(res, 2500));
    }
  }
  if(!done){
    alert(lastErr);
    slot.state='ready';
  }
  render();
}

let adBusy = false, adUsed = 0, adMax = 50;
function setAdCard(used, max){
  if(used!=null){ adUsed = used; adMax = max; }
  used = adUsed; max = adMax;
  const c = document.getElementById('adCount');
  const b = document.getElementById('adBtn');
  if(!c || !b) return;
  c.textContent = used+'/'+max+' ads watched today';
  const full = used >= max;
  b.disabled = full || adBusy;
  b.textContent = full ? '✅ Daily limit reached' : (adBusy ? 'Please wait...' : '🎬 Watch Ad & Earn');
}
async function refreshAdCard(){
  try{ const r = await api('adStatus', {}, AD_URL); setAdCard(r.used, r.max); }
  catch(e){ const c = document.getElementById('adCount'); if(c) c.textContent = 'Could not load ad status.'; }
}
async function handleWatchAd(){
  if(adBusy) return;
  adBusy = true;
  setAdCard();
  try{
    const r0 = await api('adStart');
    const watched = await watchAd(r0.ymid);
    if(watched){
      let done = false, lastErr = '';
      for(let t=0; t<8 && !done; t++){
        try{
          const r = await api('adClaim', { ymid: r0.ymid }, AD_URL);
          state.balance = r.balance;
          adBusy = false;
          setAdCard(r.used, r.max);
          done = true;
        }catch(e){
          lastErr = e.message;
          if(lastErr.indexOf('not confirmed yet')===-1) break;
          await new Promise(res=>setTimeout(res, 2500));
        }
      }
      if(!done) alert(lastErr);
    }
  }catch(e){ alert(e.message); }
  adBusy = false;
  render();
  refreshAdCard();
}

async function handleStart(i){
  const slot = state.slots[i];
  if(slot.state!=='idle') return;
  try{
    const r = await api('start', { i });
    applyServerState(r.state);
    calibrate(state.slots[i]);
  }catch(e){ alert(e.message); }
  render();
}

  document.getElementById('methodUSDT').classList.toggle('active', m==='USDT_BEP20');

async function loadHistory(){
  try{ const r = await api('history', {}, WD_URL); return r.rows || []; }catch(e){ return []; }
}

async function renderHistory(){
  const rows = await loadHistory();
  const container = document.getElementById('wdHistory');
  if(!container) return;
  if(rows.length===0){
    container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:12px;">No withdrawal history yet.</div>';
    return;
  }
  const BADGES = {
    pending:['⏳ Pending','#f0b429'], approved:['✅ Approved','#4cc38a'], paid:['💸 Paid','#4cc38a'],
    rejected:['❌ Rejected','#ef6461'], cancelled:['⚠️ Cancelled','#9aa3b2']
  };
  container.innerHTML = rows.map(r=>{
    const b = BADGES[r.status] || [r.status,'#9aa3b2'];
    const methodLabel = r.method==='TON' ? 'TON' : 'USDT (BEP20)';
    const date = new Date(r.created_at).toLocaleDateString();
    const net = r.net!=null ? ' • you get $'+(r.net*RATE).toFixed(4) : '';
    const tx = r.txid ? '<div class="wd-sub" style="word-break:break-all;">TXID: '+esc(r.txid)+'</div>' : '';
    return '<div class="wd-item"><div class="wd-top"><span>'+Number(r.amount).toLocaleString()+' coins</span><span style="color:'+b[1]+'">'+b[0]+'</span></div><div class="wd-sub">'+methodLabel+' • '+date+net+'</div>'+tx+'</div>';
  }).join('');
}

function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function wdPreview(){
  const el = document.getElementById('wdPreview');
  const amt = parseInt(document.getElementById('wdAmount').value);
  if(!el) return;
  if(!amt || amt<MIN_WITHDRAW){ el.textContent = 'Fee: '+FEE_PERCENT+'% (network fees may apply)'; return; }
  const fee = Math.ceil(amt*FEE_PERCENT/100);
  el.textContent = 'Fee: '+fee.toLocaleString()+' coins • You receive about $'+((amt-fee)*RATE).toFixed(4);
}

async function handleWithdraw(){
  const amtInput = document.getElementById('wdAmount');
  const walletInput = document.getElementById('wdWallet');
  const msg = document.getElementById('wdMessage');
  const amt = parseInt(amtInput.value);
  const wallet = walletInput.value.trim();
  msg.textContent='';
  if(!amt || amt < MIN_WITHDRAW){ msg.textContent = 'Minimum withdrawal is '+MIN_WITHDRAW.toLocaleString()+' coins.'; return; }
  if(amt > state.balance){ msg.textContent = 'Insufficient balance.'; return; }
  if(!wallet){ msg.textContent = 'Please enter your wallet address.'; return; }
  try{
    const r = await api('withdraw', { amount: amt, method: selectedMethod, wallet }, WD_URL);
    state.balance = r.balance;
    amtInput.value=''; walletInput.value='';
  }catch(e){
    msg.textContent = e.message;
    return;
  }
  render();
  renderHistory();
}

async function renderAdminWd(){
  const box = document.getElementById('adminWd');
  if(!box) return;
  let rows = [];
  try{ const r = await api('adminList', {}, WD_URL); rows = r.rows || []; }catch(e){ box.textContent = e.message; return; }
  const open = rows.filter(r=>r.status==='pending'||r.status==='approved');
  if(!open.length){ box.innerHTML = '<div style="color:var(--muted);text-align:center;padding:12px;">No open requests.</div>'; return; }
  box.innerHTML = open.map(r=>{
    const btns = r.status==='pending'
      ? '<button class="action btn-start" onclick="adminSet('+r.id+',\'approved\')">Approve</button>'
      : '<button class="action btn-start" onclick="adminSet('+r.id+',\'paid\')">Mark Paid</button>';
    return '<div class="wd-item"><div class="wd-top"><span>#'+r.id+' • '+Number(r.amount).toLocaleString()+' coins</span><span>'+esc(r.status)+'</span></div>'
      +'<div class="wd-sub">User '+esc(r.telegram_id)+' • '+esc(r.method)+' • send $'+((r.net||0)*RATE).toFixed(4)+'</div>'
      +'<div class="wd-sub" style="word-break:break-all;user-select:all;">'+esc(r.wallet_address)+'</div>'
      +'<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">'+btns
      +'<button class="action" style="background:#3a2230;color:#ff8a8a;" onclick="adminSet('+r.id+',\'rejected\')">Reject (refund)</button>'
      +'<button class="action" style="background:#2a2f45;color:#c7cce0;" onclick="adminSet('+r.id+',\'cancelled\')">Cancel (refund)</button></div></div>';
  }).join('');
}
async function adminSet(id, status){
  let txid = '';
  if(status==='paid'){
    txid = prompt('Paste the transaction ID (TXID):') || '';
    if(!txid.trim()) return;
  } else if(!confirm('Set request #'+id+' to '+status+'?')) return;
  try{
    await api('adminSet', { id, status, txid }, WD_URL);
  }catch(e){ alert(e.message); }
  renderAdminWd();
}

async function loadTasks(){
  try{ const r = await api('tasks'); return r.rows || []; }catch(e){ return []; }
}

async function renderTasks(){
  const container = document.getElementById('taskList');
  if(!container) return;
  const rows = await loadTasks();
  if(rows.length===0){
    container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:12px;">No tasks available right now.</div>';
    return;
  }
  container.innerHTML = rows.map(t=>{
    const done = state.tasksCompleted.includes(t.id);
    const full = t.completions_count >= t.max_completions;
    let btns;
    if(done){
      btns = '<button class="task-btn btn-full" disabled>✅ Completed</button>';
    } else if(full){
      btns = '<button class="task-btn btn-full" disabled>Full</button>';
    } else {
      btns = '<button class="task-btn btn-open" onclick="window.open(\''+t.link+'\',\'_blank\')">🔗 Open</button><button class="task-btn btn-claim" onclick="handleClaimTask('+t.id+','+t.reward+')">🎁 Claim</button>';
    }
    const typeLabel = t.type==='telegram' ? 'Telegram' : 'Social Media';
    return '<div class="task-item"><div class="task-top"><span class="task-title">'+t.title+'</span><span class="task-reward">+'+t.reward+' coins</span></div><div class="task-sub">'+typeLabel+' • '+t.completions_count+'/'+t.max_completions+' claimed</div><div class="task-btn-row">'+btns+'</div></div>';
  }).join('');
}

async function handleClaimTask(taskId, reward){
  if(state.tasksCompleted.includes(taskId)) return;
  try{
    const r = await api('claimTask', { taskId });
    applyServerState(r.state);
  }catch(e){ alert(e.message); }
  render();
  renderTasks();
}

function updateFeePreview(){
  const max = parseInt(document.getElementById('taskMax').value) || 0;
  const feeBox = document.getElementById('taskFeePreview');
  if(!feeBox) return;
  const fee = (0.10*(max/100)).toFixed(2);
  feeBox.textContent = 'Fee for '+max+' completions: $'+fee;
}

async function handleCreateTask(){
  const title = document.getElementById('taskTitle').value.trim();
  const link = document.getElementById('taskLink').value.trim();
  const type = document.getElementById('taskType').value;
  const max = parseInt(document.getElementById('taskMax').value);
  const msg = document.getElementById('taskMsg');
  msg.textContent='';
  msg.className='error-msg';
  if(!title || !link || !max || max<100){ msg.textContent = 'Fill all fields (minimum 100 completions).'; return; }
  let result;
  try{
    result = await api('createTask', { title, link, type, max });
  }catch(e){
    msg.textContent = e.message;
    return;
  }
  document.getElementById('taskTitle').value='';
  document.getElementById('taskLink').value='';
  document.getElementById('taskMax').value='';
  msg.className='success-msg';
  if(result.active){
    msg.textContent = '✅ Task created and is now live!';
  } else {
    const fee = (0.10*(max/100)).toFixed(2);
    msg.textContent = '✅ Submitted! Send $'+fee+' to a wallet below, then message support to activate it.';
  }
  renderTasks();
}

function showTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('btn-'+tab).classList.add('active');
  if(tab==='withdraw'){ renderHistory(); if(IS_OWNER) renderAdminWd(); wdPreview(); }
  if(tab==='tasks'){ renderTasks(); }
}

function render(){
  document.getElementById('balanceCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('balanceUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  document.getElementById('profileCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('profileUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  document.getElementById('profileReferrals').textContent = state.referralCount;
  document.getElementById('wdBalance').textContent = state.balance.toLocaleString()+" coins";

  const container = document.getElementById('slots');
  container.innerHTML='';
  SLOT_CONFIG.forEach((cfg,i)=>{
    const slot = state.slots[i];
    const div = document.createElement('div');
    div.className='slot';
    const pct = Math.min(100, (slot.sessions/MAX_SESSIONS)*100);
    let btnHtml='';
    if(slot.state==='completed'){
      btnHtml = '<button class="action btn-done" disabled>✅ Completed</button>';
    } else if(slot.state==='idle'){
      btnHtml = '<button class="action btn-start" onclick="handleStart('+i+')">▶️ Start Mining</button>';
    } else if(slot.state==='mining'){
      const remain = slot.endTime - nowMs();
      if(remain<=0){
        slot.state='ready';
        saveState();
        btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch '+cfg.ads+' Ad'+(cfg.ads>1?'s':'')+' to Collect</button>';
      } else {
        btnHtml = '<button class="action btn-wait" disabled>⏳ '+fmtTime(remain)+'</button>';
      }
    } else if(slot.state==='ready'){
      btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch '+cfg.ads+' Ad'+(cfg.ads>1?'s':'')+' to Collect</button>';
    } else if(slot.state==='watching'){
      btnHtml = '<button class="action btn-wait" disabled>Watching ad '+(slot.adsWatched+1)+' of '+cfg.ads+'...</button>';
    }
    div.innerHTML = `
      <div class="slot-top">
        <div class="slot-name">${cfg.name}</div>
        <div class="slot-rate">+${cfg.coins} coins/hr</div>
      </div>
      <div class="slot-progress">${slot.sessions}/${MAX_SESSIONS} sessions completed</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      ${btnHtml}
    `;
    container.appendChild(div);
  });
}

async function startApp(){
  try{
    state = await loadState();
  }catch(e){
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:40px 16px;color:#ff6b6b;">Could not load your data: '+(e && e.message ? e.message : 'unknown error')+'<br><br>Please close and reopen the app from Telegram.</div>';
    return;
  }
  const name = TG_USER ? (TG_USER.first_name||'') + (TG_USER.last_name?(' '+TG_USER.last_name):'') : 'Guest';
  const username = TG_USER && TG_USER.username ? '@'+TG_USER.username : '';
  const photo = TG_USER && TG_USER.photo_url ? '<img src="'+TG_USER.photo_url+'">' : '⛏️';

  const paymentBox = IS_OWNER ? '' : `
    <div class="wallet-box">
      Non-owner task fee: $0.10 per 100 completions.<br>
      <b>USDT (BEP20):</b> ${WALLET_USDT}<br>
      <b>TON:</b> ${WALLET_TON}<br>
      After sending payment, message <a href="${SUPPORT_LINK}" style="color:var(--gold);" target="_blank">support</a> to activate your task.
    </div>
  `;

  document.getElementById('app').innerHTML = `
    <div class="tab-content active" id="tab-mine">
      <h1>⛏️ MineEarn</h1>
      <div class="balance">
        <div class="coins" id="balanceCoins"></div>
        <div class="usd" id="balanceUsd"></div>
      </div>
      <div class="slot" id="adCard">
        <div class="slot-top"><div class="slot-name">🎬 Watch Ad</div><div class="slot-rate">+100 coins</div></div>
        <div class="slot-progress" id="adCount">Loading...</div>
        <button class="action btn-collect" id="adBtn" onclick="handleWatchAd()">🎬 Watch Ad &amp; Earn</button>
      </div>
      <div id="slots"></div>
    </div>
    <div class="tab-content" id="tab-tasks">
      <h1>📋 Tasks</h1>
      <div class="section-title">Available Tasks</div>
      <div id="taskList"></div>
      <div class="section-title">Create a Task</div>
      ${paymentBox}
      <div class="form-group">
        <label class="form-label">Task title</label>
        <input type="text" id="taskTitle" class="form-input" placeholder="e.g. Join our channel">
      </div>
      <div class="form-group">
        <label class="form-label">Link</label>
        <input type="text" id="taskLink" class="form-input" placeholder="https://t.me/yourchannel">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="taskType" class="form-input">
          <option value="telegram">Telegram (250 coins)</option>
          <option value="social">Social Media (300 coins)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Number of completions wanted</label>
        <input type="number" id="taskMax" class="form-input" placeholder="e.g. 100" oninput="updateFeePreview()">
        ${IS_OWNER ? '' : '<div class="task-sub" id="taskFeePreview" style="margin-top:6px;"></div>'}
      </div>
      <div class="error-msg" id="taskMsg"></div>
      <button class="action btn-start" onclick="handleCreateTask()">Create Task</button>
    </div>
    <div class="tab-content" id="tab-profile">
      <h1>👤 Profile</h1>
      <div class="profile-card">
        <div class="profile-avatar">${photo}</div>
        <div class="profile-name">${name}</div>
        <div class="profile-username">${username}</div>
        <div class="stat-row"><span class="stat-label">Balance</span><span class="stat-value" id="profileCoins"></span></div>
        <div class="stat-row"><span class="stat-label">USD Value</span><span class="stat-value" id="profileUsd"></span></div>
        <div class="stat-row"><span class="stat-label">Referrals</span><span class="stat-value" id="profileReferrals"></span></div>
        <a class="support-btn" href="${SUPPORT_LINK}" target="_blank">🆘 Contact Support</a>
      </div>
    </div>
    <div class="tab-content" id="tab-withdraw">
      <h1>💸 Withdraw</h1>
      <div class="balance">
        <div class="coins" id="wdBalance"></div>
        <div class="usd">Available balance</div>
      </div>
      <div class="form-group">
        <label class="form-label">Amount (min ${MIN_WITHDRAW.toLocaleString()} coins)</label>
        <input type="number" id="wdAmount" class="form-input" placeholder="e.g. 20000" oninput="wdPreview()">
        <div class="task-sub" id="wdPreview" style="margin-top:6px;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Payout method</label>
        <div class="method-row">
          <div class="method-btn active" id="methodUSDT" onclick="selectMethod('USDT_BEP20')">USDT (BEP20)</div>
          <div class="method-btn" id="methodTON" onclick="selectMethod('TON')">TON</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Wallet address</label>
        <input type="text" id="wdWallet" class="form-input" placeholder="Paste your wallet address">
      </div>
      <div class="error-msg" id="wdMessage"></div>
      <button class="action btn-start" onclick="handleWithdraw()">Request Withdrawal</button>
      <div class="section-title">History</div>
      <div id="wdHistory"></div>
      ${IS_OWNER ? '<div class="section-title">Admin: withdrawal requests</div><div id="adminWd"></div>' : ''}
    </div>
  `;
  document.getElementById('tabbar').style.display='flex';
  refreshAdCard();
  setInterval(render, 1000);
  render();
  renderTasks();
}

async function init(){
  const joined = await checkMembership();
  if(joined){
    startApp();
  } else {
    renderGate();
  }
}
init();

if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
