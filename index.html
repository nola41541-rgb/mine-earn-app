        <div class="tile"><div class="tile-num" id="homeRefs">0</div><div class="tile-lbl">Referrals</div></div>
      </div>
      <div class="section-title">Daily login bonus</div>
      <div class="login-row" id="loginRow"></div>
      <div style="font-size:12px;color:var(--muted);margin:4px 2px 8px;line-height:1.5;">Put your own invite link in your Telegram bio, then claim once a day. Miss a day and it restarts at Day 1. We only check that your bio contains your link.</div>
      <button class="action btn-collect" style="width:100%;margin-bottom:6px;" id="loginBtn" onclick="loginClaim()">🎁 Claim daily bonus</button>
      <div id="loginMsg" style="font-size:12px;color:var(--muted);margin:2px 2px 10px;min-height:16px;"></div>
      <div class="section-title">Ways to earn</div>
      <div class="earn-card" onclick="showTab('mine')"><div class="earn-ic">⛏️</div><div class="earn-tx"><b>Mining</b><span>5 slots • watch 2 ads per collect • ${AD_PAY} coins per ad</span></div><div class="earn-go">›</div></div>
      <div class="earn-card" onclick="showTab('play')"><div class="earn-ic">🎮</div><div class="earn-tx"><b>Games</b><span>6 games • up to 250 coins per play • 5 plays each daily</span></div><div class="earn-go">›</div></div>
      <div class="earn-card" onclick="showTab('tasks')"><div class="earn-ic ic-tasks"><svg viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="17" rx="3"/><path d="M9 4.5V3.6c0-.5.4-.9.9-.9h4.2c.5 0 .9.4.9.9v.9"/><path d="M8.8 13.2l2.2 2.2 4.4-4.6"/></svg></div><div class="earn-tx"><b>Tasks</b><span>Join channels and follow pages for coins</span></div><div class="earn-go">›</div></div>
      <div class="earn-card" onclick="comOpen('payouts')"><div class="earn-ic">🏆</div><div class="earn-tx"><b>Payouts &amp; leaderboard</b><span>See real payments and the top earners</span></div><div class="earn-go">›</div></div>
      <div class="earn-card" onclick="howOpen(0)"><div class="earn-ic">📖</div><div class="earn-tx"><b>How it works</b><span>Earning, coins and withdrawals explained</span></div><div class="earn-go">›</div></div>
      <div class="section-title">Invite &amp; earn</div>
      <div class="invite-card">
        <div class="invite-top"><div class="earn-ic">👥</div><div class="earn-tx"><b>Invite friends</b><span>500 coins when a friend joins + 3,000 coins when their first withdrawal is paid</span></div></div>
        <div class="invite-link" id="refLink"></div>
        <div style="display:flex;gap:8px;"><button class="action" style="flex:1;" onclick="copyRef()" id="refCopyBtn">📋 Copy link</button><button class="action btn-collect" style="flex:1;" onclick="shareRef()">📤 Share</button></div>
        <div class="tile-row" style="margin-top:12px;margin-bottom:0;">
          <div class="tile"><div class="tile-num" id="refInvited">0</div><div class="tile-lbl">Friends joined</div></div>
          <div class="tile"><div class="tile-num" id="refPaid">0</div><div class="tile-lbl">First withdrawals paid</div></div>
          <div class="tile"><div class="tile-num" id="refEarned">0</div><div class="tile-lbl">Coins earned</div></div>
        </div>
      </div>
      <a class="support-btn" href="${SUPPORT_LINK}" target="_blank">💬 Contact Support</a>
      <div class="legal-row"><a onclick="comOpen('about')">About</a><a onclick="comOpen('terms')">Terms</a><a onclick="comOpen('privacy')">Privacy</a></div>
        ${IS_OWNER ? '<button class="action btn-collect" style="margin-top:10px;" onclick="admOpen()">🛠 Admin panel</button>' : ''}
    </div>
    <div class="tab-content" id="tab-mine">
      <h1>MineEarn</h1>
      <div class="balance">
        <div class="coins" id="balanceCoins"></div>
        <div class="usd" id="balanceUsd"></div>
      </div>
      <div class="task-sub" id="dailyAds" style="text-align:center;margin-bottom:10px;"></div>
      <div id="minePick"></div>
      <div id="mineBack" style="display:none;"><button class="mine-back" onclick="mineGo('pick')">‹ Back</button></div>
      <div id="slots" style="display:none;"></div>
      <div id="richSlot" style="display:none;"></div>
    </div>
    <div class="tab-content" id="tab-play">
      <h1>Play &amp; Earn</h1>
      <div class="chip-row"><div class="chip"><span class="coin"></span><b id="playBal">0</b></div><div class="chip">5 plays per game daily</div><div class="chip">Max 250 coins per play</div></div>
      <div id="playList"></div>
    </div>
    <div class="tab-content" id="tab-tasks">
      <h1>Tasks</h1>
      <div class="tk-sub">Pick a category and collect coins.</div>
      <div class="tk-cats" id="tkCats">
        <button class="tk-cat active" data-c="social" onclick="tkSetCat('social')"><svg viewBox="0 0 24 24"><path d="M4 12l16-7-5 15-3-6z"/></svg><span>Social</span></button>
        <button class="tk-cat" data-c="daily" onclick="tkSetCat('daily')"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span>Daily Wins</span><i class="tk-dot" id="tkDailyDot"></i></button>
        <button class="tk-cat" data-c="exclusive" onclick="tkSetCat('exclusive')"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg><span>Special</span></button>
        <button class="tk-cat" data-c="partner" onclick="tkSetCat('partner')"><svg viewBox="0 0 24 24"><path d="M3 12l4-4 4 3 3-3 4 4-7 7z"/></svg><span>Featured</span></button>
      </div>
      <div class="tk-bar">
        <div class="tk-view"><button class="active" id="tkViewAll" onclick="tkSetView('all')">Tasks</button><button id="tkViewMine" onclick="tkSetView('mine')">Completed tasks</button></div>
        <div style="display:flex;gap:8px;">${IS_OWNER ? '<button class="tk-new" onclick="openManageSheet()">⚙ Manage</button>' : ''}<button class="tk-new" id="tkNewBtn" onclick="openTaskSheet()">＋ New</button></div>
      </div>
      <div class="tk-count" id="tkCount"></div>
      <div id="taskList"></div>
    </div>
    <div class="sheet-bg" id="taskSheetBg" onclick="closeTaskSheet()"></div>
    <div class="sheet" id="manageSheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Manage tasks</div>
      <div id="manageList"></div>
      <button class="action" style="margin-top:8px;" onclick="closeManageSheet()">Close</button>
    </div>
    <div class="sheet" id="taskSheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title">${IS_OWNER ? 'Create a task' : 'Create a Special task'}</div>
      ${IS_OWNER ? '' : '<div class="wallet-box" style="line-height:1.5;">Fill in your task, then tap <b>Contact support</b>. A message with all your details opens in our support chat. Support will confirm the price ($0.10 per 100 users), and your task goes live after payment.</div>'}
      <div class="form-group">
        <label class="form-label">Task title</label>
        <input type="text" id="taskTitle" class="form-input" placeholder="e.g. Join our channel">
      </div>
      <div class="form-group">
        <label class="form-label">Link</label>
        <input type="text" id="taskLink" class="form-input" placeholder="https://t.me/yourchannel">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="taskType" class="form-input">
          <option value="telegram">Telegram (250 coins)</option>
          <option value="social">Social Media (300 coins)</option>
        </select>
      </div>
      ${IS_OWNER ? '<div class="form-group"><label class="form-label">Category</label><select id="taskCat" class="form-input"><option value="exclusive">Special</option><option value="partner">Featured</option><option value="social">Social</option></select></div>' : ''}
      <div class="form-group">
        <label class="form-label">Number of completions wanted</label>
        <input type="number" id="taskMax" class="form-input" placeholder="e.g. 100" oninput="updateFeePreview()">
        ${IS_OWNER ? '' : '<div class="task-sub" id="taskFeePreview" style="margin-top:6px;"></div>'}
      </div>
      <div class="error-msg" id="taskMsg"></div>
      ${IS_OWNER ? '<button class="action btn-start" onclick="handleCreateTask()">Create Task</button>' : '<button class="action btn-collect" onclick="contactSupportTask()">💬 Contact support</button>'}
      <button class="action" style="margin-top:8px;" onclick="closeTaskSheet()">Close</button>
    </div>
    <div class="tab-content" id="tab-profile">
      <h1>Profile</h1>
      <div class="profile-card">
        <div class="profile-avatar">${photo}</div>
        <div class="profile-name">${name}</div>
        <div class="profile-username">${username}</div>
        <div class="stat-row"><span class="stat-label">Balance</span><span class="stat-value" id="profileCoins"></span></div>
        <div class="stat-row"><span class="stat-label">USD Value</span><span class="stat-value" id="profileUsd"></span></div>
        <div class="stat-row"><span class="stat-label">Referrals</span><span class="stat-value" id="profileReferrals"></span></div>
        <a class="support-btn" href="${SUPPORT_LINK}" target="_blank">💬 Contact Support</a>
        <div class="legal-row"><a onclick="comOpen('about')">About</a><a onclick="comOpen('terms')">Terms</a><a onclick="comOpen('privacy')">Privacy</a></div>
      </div>
      <h1 id="wdSection" style="margin-top:24px;">Withdraw</h1>
      <div class="balance">
        <div class="coins" id="wdBalance"></div>
        <div class="usd">Available balance</div>
      </div>
      <div class="form-group">
        <div class="wallet-box" style="line-height:1.5;margin-bottom:10px;font-size:12px;">Requests are approved within <b>${WD_HOURS} hours</b>. If yours is not approved by then, contact the owner of Boss Crypto Hub: <b>${WD_CONTACT}</b>.</div>
        <label class="form-label">Amount (min ${MIN_WITHDRAW.toLocaleString()} coins)</label>
        <input type="number" id="wdAmount" class="form-input" placeholder="e.g. 20000" oninput="wdPreview()">
        <div class="task-sub" id="wdPreview" style="margin-top:6px;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Payout method</label>
        <div class="method-row">
          <div class="method-btn active" id="methodUSDT" onclick="selectMethod('USDT_BEP20')">USDT (BEP20)</div>
          <div class="method-btn" id="methodTON" onclick="selectMethod('TON')">TON</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Wallet address</label>
        <input type="text" id="wdWallet" class="form-input" placeholder="Paste your wallet address">
      </div>
      <div class="error-msg" id="wdMessage"></div>
      <button class="action btn-start" onclick="handleWithdraw()">Request Withdrawal</button>
      <div class="section-title">History</div>
      <div id="wdHistory"></div>
      ${IS_OWNER ? '<div class="section-title">Admin: withdrawal requests</div><div id="adminWd"></div>' : ''}
    </div>
  `;
  document.getElementById('tabbar').style.display='flex';
  refJoinOnce().then(()=>{ renderHome(); });
  setInterval(render, 1000);
  render();
  renderTasks();
  if(REVIEW){ document.body.classList.add('rv'); TK.cat = 'social'; TK.view = 'all'; showTab('play'); }
}

async function init(){
  try{ const fl = await api('flags', {}, FLAGS_URL); REVIEW = !!fl.review; }catch(e){}
  const joined = REVIEW ? true : await checkMembership();
  if(joined){
    startApp(); prefetchAll();
  } else {
    await splashFinish();
    renderGate();
  }
}
init();

if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
