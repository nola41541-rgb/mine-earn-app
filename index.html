<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineEarn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0a0f23;--card:#131a35;--gold:#ffd23c;--text:#fff;--muted:#9aa4c7;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding:16px 16px 90px 16px;}
  h1{text-align:center;margin:8px 0 4px;font-size:24px;}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);}
  .balance{text-align:center;background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;}
  .balance .coins{font-size:28px;font-weight:bold;color:var(--gold);}
  .balance .usd{color:var(--muted);font-size:13px;margin-top:4px;}
  .slot{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;}
  .slot-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .slot-name{font-weight:bold;font-size:16px;}
  .slot-rate{color:var(--gold);font-size:13px;}
  .slot-progress{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .bar{background:#222b4d;border-radius:6px;height:6px;overflow:hidden;margin-bottom:10px;}
  .bar-fill{background:var(--gold);height:100%;}
  button.action{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;}
  .btn-start{background:#3b82f6;color:#fff;}
  .btn-wait{background:#333c5e;color:var(--muted);}
  .btn-collect{background:var(--gold);color:#1a1500;}
  .btn-done{background:#2f3a2f;color:#7ecb7e;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal-box{background:var(--card);padding:24px;border-radius:14px;text-align:center;max-width:280px;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid #222b4d;z-index:40;}
  .tab-btn{flex:1;background:none;border:none;color:var(--muted);padding:10px 0;font-size:12px;}
  .tab-btn.active{color:var(--gold);}
  .tab-content{display:none;}
  .tab-content.active{display:block;}
  .profile-card{background:var(--card);border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;}
  .profile-avatar{width:72px;height:72px;border-radius:50%;background:#222b4d;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 10px;overflow:hidden;}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;}
  .profile-name{font-size:18px;font-weight:bold;}
  .profile-username{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .stat-row{display:flex;justify-content:space-between;background:#0f1730;border-radius:10px;padding:12px 16px;margin-bottom:8px;}
  .stat-label{color:var(--muted);font-size:13px;}
  .stat-value{font-weight:bold;color:var(--gold);}
</style>
</head>
<body>
<div id="app"><div class="loading" id="loadingMsg">Loading your data...</div></div>

<nav class="tabbar" id="tabbar" style="display:none;">
  <button class="tab-btn active" id="btn-mine" onclick="showTab('mine')">⛏️<br>Mine</button>
  <button class="tab-btn" id="btn-profile" onclick="showTab('profile')">👤<br>Profile</button>
</nav>

<div class="modal" id="adModal" style="display:none;">
  <div class="modal-box">
    <div id="adText">Loading ad...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wtaqrahiqjfkdfcrbetn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0YXFyYWhpcWpma2RmY3JiZXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDgwMjMsImV4cCI6MjEwNTQyNDAyM30.2DcbBtWcrbWYOAgyanz9-CsFdoK6Ynwu-CMn9w9bZcc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const RATE = 0.16/16000;
const SLOT_CONFIG = [
  {name:"Slot 1", coins:140, ads:1},
  {name:"Slot 2", coins:185, ads:1},
  {name:"Slot 3", coins:250, ads:1},
  {name:"Slot 4", coins:300, ads:2},
  {name:"Slot 5", coins:325, ads:2},
  {name:"Slot 6", coins:400, ads:3},
];
const MAX_SESSIONS = 10;
const SESSION_MS = 30*60*1000;

function getTelegramUser(){
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user){
    return window.Telegram.WebApp.initDataUnsafe.user;
  }
  return null;
}
function getTelegramId(){
  const u = getTelegramUser();
  if(u) return String(u.id);
  let testId = localStorage.getItem('testTelegramId');
  if(!testId){
    testId = 'test_' + Math.random().toString(36).slice(2,10);
    localStorage.setItem('testTelegramId', testId);
  }
  return testId;
}
const TG_ID = getTelegramId();
const TG_USER = getTelegramUser();
let state = null;

function defaultSlots(){
  return SLOT_CONFIG.map(()=>({sessions:0, state:'idle', endTime:null, adsWatched:0}));
}

async function loadState(){
  const { data } = await sb.from('users').select('*').eq('telegram_id', TG_ID).maybeSingle();
  if(data){
    let slots;
    try{ slots = JSON.parse(data.slots); }catch(e){ slots = defaultSlots(); }
    slots.forEach(sl=>{ if(sl.state==='watching') sl.state='ready'; });
    return { balance: data.balance, slots, referralCount: data.referral_count||0 };
  } else {
    const initial = { telegram_id: TG_ID, balance:0, slots: JSON.stringify(defaultSlots()), referral_count:0 };
    await sb.from('users').insert(initial);
    return { balance:0, slots: defaultSlots(), referralCount:0 };
  }
}

async function saveState(){
  await sb.from('users').update({ balance: state.balance, slots: JSON.stringify(state.slots) }).eq('telegram_id', TG_ID);
}

function fmtTime(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}

function watchAd(){
  return new Promise((resolve)=>{
    const modal = document.getElementById('adModal');
    const text = document.getElementById('adText');
    modal.style.display='flex';
    let count=3;
    text.textContent = "Ad playing... "+count;
    const iv = setInterval(()=>{
      count--;
      if(count<=0){
        clearInterval(iv);
        modal.style.display='none';
        resolve();
      } else {
        text.textContent = "Ad playing... "+count;
      }
    },1000);
  });
}

async function handleCollect(i){
  const cfg = SLOT_CONFIG[i];
  const slot = state.slots[i];
  if(slot.state!=='ready') return;
  slot.state='watching';
  render();
  for(let a=slot.adsWatched; a<cfg.ads; a++){
    await watchAd();
    slot.adsWatched++;
    await saveState();
    render();
  }
  state.balance += cfg.coins;
  slot.sessions++;
  slot.adsWatched=0;
  if(slot.sessions>=MAX_SESSIONS){
    slot.state='completed';
    slot.endTime=null;
  } else {
    slot.state='mining';
    slot.endTime = Date.now()+SESSION_MS;
  }
  await saveState();
  render();
}

async function handleStart(i){
  const slot = state.slots[i];
  if(slot.state!=='idle') return;
  slot.state='mining';
  slot.endTime = Date.now()+SESSION_MS;
  await saveState();
  render();
}

function showTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('btn-'+tab).classList.add('active');
}

function render(){
  document.getElementById('balanceCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('balanceUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  document.getElementById('profileCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('profileUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  document.getElementById('profileReferrals').textContent = state.referralCount;

  const container = document.getElementById('slots');
  container.innerHTML='';
  SLOT_CONFIG.forEach((cfg,i)=>{
    const slot = state.slots[i];
    const div = document.createElement('div');
    div.className='slot';
    const pct = Math.min(100, (slot.sessions/MAX_SESSIONS)*100);
    let btnHtml='';
    if(slot.state==='completed'){
      btnHtml = '<button class="action btn-done" disabled>✅ Completed</button>';
    } else if(slot.state==='idle'){
      btnHtml = '<button class="action btn-start" onclick="handleStart('+i+')">▶️ Start Mining</button>';
    } else if(slot.state==='mining'){
      const remain = slot.endTime - Date.now();
      if(remain<=0){
        slot.state='ready';
        saveState();
        btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch '+cfg.ads+' Ad'+(cfg.ads>1?'s':'')+' to Collect</button>';
      } else {
        btnHtml = '<button class="action btn-wait" disabled>⏳ '+fmtTime(remain)+'</button>';
      }
    } else if(slot.state==='ready'){
      btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch '+cfg.ads+' Ad'+(cfg.ads>1?'s':'')+' to Collect</button>';
    } else if(slot.state==='watching'){
      btnHtml = '<button class="action btn-wait" disabled>Watching ad '+(slot.adsWatched+1)+' of '+cfg.ads+'...</button>';
    }
    div.innerHTML = `
      <div class="slot-top">
        <div class="slot-name">${cfg.name}</div>
        <div class="slot-rate">+${cfg.coins} coins/hr</div>
      </div>
      <div class="slot-progress">${slot.sessions}/${MAX_SESSIONS} sessions completed</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      ${btnHtml}
    `;
    container.appendChild(div);
  });
}

async function init(){
  state = await loadState();
  const name = TG_USER ? (TG_USER.first_name||'') + (TG_USER.last_name?(' '+TG_USER.last_name):'') : 'Guest';
  const username = TG_USER && TG_USER.username ? '@'+TG_USER.username : '';
  const photo = TG_USER && TG_USER.photo_url ? '<img src="'+TG_USER.photo_url+'">' : '⛏️';

  document.getElementById('app').innerHTML = `
    <div class="tab-content active" id="tab-mine">
      <h1>⛏️ MineEarn</h1>
      <div class="balance">
        <div class="coins" id="balanceCoins"></div>
        <div class="usd" id="balanceUsd"></div>
      </div>
      <div id="slots"></div>
    </div>
    <div class="tab-content" id="tab-profile">
      <h1>👤 Profile</h1>
      <div class="profile-card">
        <div class="profile-avatar">${photo}</div>
        <div class="profile-name">${name}</div>
        <div class="profile-username">${username}</div>
        <div class="stat-row"><span class="stat-label">Balance</span><span class="stat-value" id="profileCoins"></span></div>
        <div class="stat-row"><span class="stat-label">USD Value</span><span class="stat-value" id="profileUsd"></span></div>
        <div class="stat-row"><span class="stat-label">Referrals</span><span class="stat-value" id="profileReferrals"></span></div>
      </div>
    </div>
  `;
  document.getElementById('tabbar').style.display='flex';
  setInterval(render, 1000);
  render();
}
init();

if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
  </html>
