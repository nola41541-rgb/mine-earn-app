// Phone clocks can be wrong, so timers use Telegram's server time (auth_date) as the reference
let CLOCK_OFFSET = 0;
function nowMs(){ return Date.now() + CLOCK_OFFSET; }
(function(){
  try{
    const ad = Number(window.Telegram.WebApp.initDataUnsafe.auth_date);
    if(ad > 0){
      const off = ad*1000 - Date.now();
      if(Math.abs(off) < 12*3600*1000) CLOCK_OFFSET = off;
    }

})();
// After the server sets a fresh 30-minute timer, use it to correct the offset precisely
function calibrate(slot){
  if(slot && slot.endTime && slot.state==='mining'){
    const off = (Number(slot.endTime) - SESSION_MS) - Date.now();
    if(Math.abs(off) < 12*3600*1000) CLOCK_OFFSET = off;
  }
}
async function api(action, payload, url){
  const initData = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
  const res = await fetch(url || API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
    body: JSON.stringify(Object.assign({ action, initData }, payload || {}))
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function fmtTime(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}

// One ad per tap: the user must press "Watch ad" before every single ad (no auto-chaining)
async function handleCollect(i){
  const cfg = SLOT_CONFIG[i];
  const slot = state.slots[i];
  if(slot.busy) return;
  if(slot.state!=='ready' && slot.state!=='watching') return;
  if(slot.state==='ready'){ slot.state='watching'; slot.adsWatched=0; slot.ymids=[]; }
  if(!slot.ymids) slot.ymids = [];
  slot.busy = true; render();
  if(slot.adsWatched < cfg.ads){
    let ymid = null;
    try{ ymid = (await api('adStart')).ymid; }
    catch(e){
      alert(e.message);
      slot.busy = false;
      if(slot.adsWatched===0) slot.state='ready';
      render(); return;
    }
    const watched = await watchAd(ymid);
    if(!watched){ slot.busy = false; render(); return; }
    slot.ymids.push(ymid);
    slot.adsWatched++;
    if(slot.adsWatched < cfg.ads){ slot.busy = false; render(); return; }
  }
  // all required ads watched -> collect (retry while Monetag confirms)
  let done = false, lastErr = '';
  for(let t=0; t<8 && !done; t++){
    try{
      const r = await api('collect', { i, ymids: slot.ymids });
      applyServerState(r.state);
      calibrate(state.slots[i]);
      done = true;
    }catch(e){
      lastErr = e.message;
      if(lastErr.indexOf('not confirmed yet')===-1) break;
      await new Promise(res=>setTimeout(res, 2500));
    }
  }
  const cur = state.slots[i];
  cur.busy = false;
  if(!done){ alert(lastErr); }
  else { cur.ymids = []; }
  render();
}

const SN = { N:12, maxAtt:5 };
function snakeInit(){
  const cv = gEl('gCanvas');
  const size = Math.floor(Math.min(window.innerWidth-20, 400)/SN.N)*SN.N;
  cv.width = size; cv.height = size;
  SN.cell = size/SN.N;
  SN.score = 0; SN.att = 1;
  let sx=0, sy=0;
  cv.ontouchstart = e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; e.preventDefault(); };
  cv.ontouchend = e=>{
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
    if(Math.abs(dx)>Math.abs(dy)) snakeTurn(dx>0?1:-1,0); else snakeTurn(0,dy>0?1:-1);
    e.preventDefault();
  };
  snakeSpawn();
}
function snakeLabel(){ gEl('gScore').textContent = 'Score '+SN.score+' • Attempt '+SN.att+'/'+SN.maxAtt; }
function snakeSpawn(){
  SN.body = [{x:5,y:6},{x:4,y:6},{x:3,y:6}];
  SN.dir = {x:1,y:0}; SN.next = {x:1,y:0};
  SN.started = false; SN.dead = false; SN.resumed = false;
  SN.food = snakeFood();
  gEl('gResult').style.display = 'none';
  gEl('gPad').style.display = 'grid';
  snakeLabel();
  snakeDraw();
}
function snakeFood(){
  while(true){
    const f = {x:Math.floor(Math.random()*SN.N), y:Math.floor(Math.random()*SN.N)};
    if(!SN.body.some(p=>p.x===f.x&&p.y===f.y)) return f;
  }
}
function snakeTurn(x,y){
  if(!G || G.over || G.id!=='snake' || SN.dead) return;
  if(!SN.started){
    if(SN.resumed){
      // continuing after an ad: ignore a swipe that would run straight into the body
      const N = SN.N, hd = SN.body[0];
      const tx = (hd.x+x+N)%N, ty = (hd.y+y+N)%N;
      const blocked = SN.body.slice(0,-1).some(p=>p.x===tx&&p.y===ty);
      if(blocked) return;
    } else if(x===-SN.dir.x && y===-SN.dir.y){
      // first input of a fresh attempt pointing backwards: turn the snake around
      SN.body.reverse();
    }
    SN.dir = {x,y}; SN.next = {x,y};
    SN.started = true;
    G.timer = setTimeout(snakeStep, 200);
    return;
  }
  if(x===-SN.dir.x && y===-SN.dir.y) return;
  SN.next = {x,y};
}
function snakeStep(){
  if(!G || G.over || G.id!=='snake' || SN.dead) return;
  SN.dir = SN.next;
  const N = SN.N;
  const h = { x:(SN.body[0].x+SN.dir.x+N)%N, y:(SN.body[0].y+SN.dir.y+N)%N };
  const ate = h.x===SN.food.x && h.y===SN.food.y;
  const tail = ate ? SN.body : SN.body.slice(0,-1);
  if(tail.some(p=>p.x===h.x&&p.y===h.y)){ snakeDie(); return; }
  SN.body.unshift(h);
  if(ate){
    SN.score++;
    snakeLabel();
    if(SN.score>=25){ snakeDraw(); finishGame(SN.score); return; }
    SN.food = snakeFood();
  } else SN.body.pop();
  snakeDraw();
  const delay = Math.max(120, 260 - SN.score*5);
  G.timer = setTimeout(snakeStep, delay);
}
function snakeDie(){
  SN.dead = true;
  if(G.timer) clearTimeout(G.timer);
  snakeDraw();
  const res = gEl('gResult');
  gEl('gPad').style.display = 'none';
  res.style.display = 'block';
  if(SN.att >= SN.maxAtt){ finishGame(SN.score); return; }
  const left = SN.maxAtt - SN.att;
  res.innerHTML = '<div style="font-size:17px;font-weight:bold;">Oops! The snake bit itself</div>'
    + '<div style="margin:8px 0;color:var(--muted);">Score so far: <b style="color:#fff;">'+SN.score+'</b> • '+left+' attempt'+(left>1?'s':'')+' left</div>'
    + '<button class="action btn-collect" onclick="snakeContinue()">🎬 Watch ad to continue</button>'
    + '<button class="action" style="margin-top:8px;" onclick="finishGame(SN.score)">Finish &amp; see result</button>';
}

// ---- Endless Runner (3 lanes: swipe left/right to switch lane, up to jump, down to slide) ----
const RN = { maxAtt:5, W:360, H:340 };
function runnerInit(){
  const cv = gEl('gCanvas');
  RN.W = Math.min(window.innerWidth-20, 400); RN.H = 340;
  cv.width = RN.W; cv.height = RN.H;
  RN.hy = RN.H*0.22; RN.py = RN.H-56; RN.laneW = RN.W*0.27;
  RN.score = 0; RN.att = 1; RN.speed = 14; RN.dist = 0;
  let sx=0, sy=0;
  cv.ontouchstart = e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; e.preventDefault(); };
  cv.ontouchend = e=>{
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<18){ runnerStart(); }
    else if(Math.abs(dx)>Math.abs(dy)) runnerMove(dx>0?1:-1);
    else runnerMove(0, dy<0?'jump':'slide');
    e.preventDefault();
  };
  cv.onmousedown = null;
  runnerSpawn();
}
function runnerLabel(){ gEl('gScore').textContent = 'Score '+RN.score+' • Attempt '+RN.att+'/'+RN.maxAtt; }
function runnerSpawn(){
  RN.lane = 0; RN.x = 0; RN.h = 0; RN.vy = 0; RN.slide = 0;
  RN.obs = []; RN.nextZ = 45;
  RN.started = false; RN.dead = false; RN.last = 0;
  gEl('gResult').style.display = 'none';
  gEl('gPad').style.display = 'none';
  gEl('gPad2').style.display = 'grid';
  runnerLabel();
  runnerDraw();
}
function runnerStart(){
  if(!G || G.over || G.id!=='runner' || RN.dead || RN.started) return false;
  RN.started = true; RN.last = Date.now(); runnerLoop(); return true;
}
function runnerMove(dir, act){
  if(!G || G.over || G.id!=='runner' || RN.dead) return;
  if(!RN.started){ runnerStart(); }
  if(act==='jump'){ if(RN.h===0){ RN.vy = 6.2; } }
  else if(act==='slide'){ RN.slide = 0.7; if(RN.h>0) RN.vy = -10; }
  else if(dir){ RN.lane = Math.max(-1, Math.min(1, RN.lane+dir)); }
}
function runnerLoop(){
  if(!G || G.over || RN.dead) return;
  const now = Date.now(); let dt = (now - RN.last)/1000; RN.last = now;
  if(dt > 0.05) dt = 0.05;
  RN.speed = Math.min(30, RN.speed + 0.25*dt);
  RN.dist += RN.speed*dt;
  const sc = Math.floor(RN.dist*0.6);
  if(sc !== RN.score){ RN.score = sc; runnerLabel(); }
  // player
  RN.x += (RN.lane - RN.x)*Math.min(1, dt*14);
  if(RN.h>0 || RN.vy>0){ RN.vy -= 20*dt; RN.h += RN.vy*dt; if(RN.h<=0){ RN.h = 0; RN.vy = 0; } }
  if(RN.slide>0) RN.slide -= dt;
  // obstacles
  for(const o of RN.obs) o.z -= RN.speed*dt;
  RN.obs = RN.obs.filter(o=>o.z > -3);
  RN.nextZ -= RN.speed*dt;
  if(RN.nextZ <= 0){
    // a row: never block every lane with something that can't be jumped or slid
    const lanes = [-1,0,1].sort(()=>Math.random()-0.5);
    const count = RN.speed>20 && Math.random()<0.5 ? 2 : 1;
    let blocks = 0;
    for(let i=0;i<count;i++){
      let type = ['low','high','block'][Math.floor(Math.random()*3)];
      if(type==='block'){ if(blocks>=1 && count===2) type='low'; else blocks++; }
      RN.obs.push({z:60, lane:lanes[i], type});
    }
    RN.nextZ = RN.speed*0.95 + 9 + Math.random()*6;
  }
  // collision
  for(const o of RN.obs){
    if(o.z > 0.8 || o.z < -0.9) continue;
    if(Math.abs(RN.x - o.lane) > 0.55) continue;
    if(o.type==='block' || (o.type==='low' && RN.h < 0.55) || (o.type==='high' && RN.slide<=0)){ runnerDie(); return; }
  }
  if(RN.score >= 1000){ RN.score = 1000; runnerLabel(); runnerDraw(); finishGame(1000); return; }
  runnerDraw();
  G.timer = setTimeout(runnerLoop, 16);
}
function runnerDie(){
  RN.dead = true;

  runnerDraw();
  const res = gEl('gResult');
  gEl('gPad2').style.display = 'none';
  res.style.display = 'block';
  if(RN.att >= RN.maxAtt){ finishGame(RN.score); return; }

function runnerHuman(c, px, gy){

  c.fillStyle = '#2a1b14'; c.beginPath(); c.arc(px+sway, hy2, 10, 0, 7); c.fill();

}
function rnProj(z){ return 1/(1+z/7); }

  const px = cx + RN.x*RN.laneW; const lift = RN.h*60; const sl = RN.slide>0;

// ---- Space Shooter (drag to move, auto-fire, 5 attempts per play) ----
const SH = { maxAtt:5, W:360, H:420, move:0 };
function shooterInit(){
  const cv = gEl('gCanvas');
  SH.W = Math.min(window.innerWidth-20, 400); SH.H = 420;
  cv.width = SH.W; cv.height = SH.H;
  SH.score = 0; SH.att = 1; SH.kills = 0;
  const setX = e=>{ const r = cv.getBoundingClientRect(); const t = e.touches[0]; SH.x = Math.max(20, Math.min(SH.W-20, t.clientX - r.left)); };
  cv.ontouchstart = e=>{ setX(e); shooterStart(); e.preventDefault(); };
  cv.ontouchmove = e=>{ setX(e); e.preventDefault(); };
  cv.onmousedown = e=>{ shooterStart(); };
  SH.stars = Array.from({length:40},()=>({x:Math.random()*SH.W,y:Math.random()*SH.H,s:Math.random()*1.6+0.4}));
  shooterSpawn();
}
function shooterLabel(){ gEl('gScore').textContent = 'Destroyed '+SH.score+'/50 • Attempt '+SH.att+'/'+SH.maxAtt; }
function shooterSpawn(){
  SH.x = SH.W/2; SH.en = []; SH.bu = []; SH.fire = 0; SH.spawn = 1.2; SH.move = 0;
  SH.started = false; SH.dead = false; SH.last = 0;
  gEl('gResult').style.display = 'none';
  gEl('gPad').style.display = 'none'; gEl('gPad2').style.display = 'none'; gEl('gPad3').style.display = 'none'; gEl('gQuiz').style.display = 'none'; gEl('gPad3').style.display = 'grid';
  shooterLabel(); shooterDraw();
}
function shooterStart(){
  if(!G || G.over || G.id!=='shooter' || SH.dead || SH.started) return;
  SH.started = true; SH.last = Date.now(); shooterLoop();
}
function shooterPress(d){ shooterStart(); SH.move = d; }
function shooterLoop(){
  if(!G || G.over || SH.dead) return;
  const now = Date.now(); let dt = (now - SH.last)/1000; SH.last = now; if(dt>0.05) dt = 0.05;
  SH.x = Math.max(20, Math.min(SH.W-20, SH.x + SH.move*300*dt));
  // fire
  SH.fire -= dt;
  if(SH.fire <= 0){ SH.bu.push({x:SH.x, y:SH.H-60}); SH.fire = 0.32; }
  for(const b of SH.bu) b.y -= 520*dt;
  SH.bu = SH.bu.filter(b=>b.y>-10);
  // enemies: slow and few at first, faster and tougher later
  SH.spawn -= dt;
  if(SH.spawn <= 0){
    const k = SH.score;
    let hp = 1; if(k>=15 && Math.random()<0.3) hp = 2; if(k>=32 && Math.random()<0.25) hp = 3;
    SH.en.push({x:24+Math.random()*(SH.W-48), y:-20, hp, hp0:hp, sp:Math.min(150, 60+k*1.8)});
    SH.spawn = Math.max(0.6, 1.4 - k*0.016);
  }
  for(const e of SH.en) e.y += e.sp*dt;
  // bullet hits
  for(const b of SH.bu){ for(const e of SH.en){ if(e.hp>0 && Math.abs(b.x-e.x)<20 && Math.abs(b.y-e.y)<18){ e.hp--; b.y = -99; if(e.hp<=0){ SH.score++; shooterLabel(); } break; } } }
  SH.en = SH.en.filter(e=>e.hp>0);
  // ship hit or enemy got through
  for(const e of SH.en){ if(e.y > SH.H-20 || (Math.abs(e.x-SH.x)<24 && Math.abs(e.y-(SH.H-40))<24)){ shooterDie(); return; } }
  for(const s of SH.stars){ s.y += s.s*40*dt; if(s.y>SH.H){ s.y=0; s.x=Math.random()*SH.W; } }
  shooterDraw();
  if(SH.score >= 50){ finishGame(50); return; }
  G.timer = setTimeout(shooterLoop, 16);
}
function shooterDie(){
  SH.dead = true; SH.move = 0;
  if(G.timer) clearTimeout(G.timer);
  shooterDraw();
  const res = gEl('gResult');
  gEl('gPad3').style.display = 'none';
  res.style.display = 'block';
  if(SH.att >= SH.maxAtt){ finishGame(SH.score); return; }
  const left = SH.maxAtt - SH.att;
  res.innerHTML = '<div style="font-size:17px;font-weight:bold;">Your ship was hit!</div>'
    + '<div style="margin:8px 0;color:var(--muted);">Destroyed so far: <b style="color:#fff;">'+SH.score+'</b> • '+left+' attempt'+(left>1?'s':'')+' left</div>'
    + '<button class="action btn-collect" onclick="shooterContinue()">🎬 Watch ad to continue</button>'
    + '<button class="action" style="margin-top:8px;" onclick="finishGame(SH.score)">Finish &amp; see result</button>';
}
async function shooterContinue(){
  const res = gEl('gResult');
  await continuePlaceholderAd(res);
  if(!G || G.over) return;
  SH.att++; SH.dead = false; SH.started = false; SH.en = []; SH.bu = []; SH.spawn = 1.2; SH.move = 0; SH.x = SH.W/2;
  gEl('gResult').style.display = 'none';
  gEl('gPad3').style.display = 'grid';
  shooterLabel(); shooterDraw();
}
function shooterDraw(){
  const cv = gEl('gCanvas'); const c = cv.getContext('2d'); const W = SH.W, H = SH.H;
  const bg = c.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#050a24'); bg.addColorStop(1,'#16205a');
  c.fillStyle = bg; c.fillRect(0,0,W,H);
  c.fillStyle = '#fff'; for(const s of SH.stars){ c.globalAlpha = 0.4+s.s*0.3; c.fillRect(s.x,s.y,s.s,s.s); } c.globalAlpha = 1;
  for(const e of SH.en){
    c.fillStyle = e.hp0===1 ? '#ff5470' : (e.hp0===2 ? '#a66bff' : '#ff9f1a');
    c.beginPath(); c.moveTo(e.x-18,e.y-10); c.lineTo(e.x+18,e.y-10); c.lineTo(e.x+10,e.y+12); c.lineTo(e.x-10,e.y+12); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(e.x-6,e.y-2,3.5,0,7); c.arc(e.x+6,e.y-2,3.5,0,7); c.fill();
    c.fillStyle = '#111'; c.beginPath(); c.arc(e.x-6,e.y-1,1.6,0,7); c.arc(e.x+6,e.y-1,1.6,0,7); c.fill();
    if(e.hp0>1){ c.fillStyle='rgba(0,0,0,0.5)'; c.fillRect(e.x-14,e.y-17,28,3); c.fillStyle='#7dff9b'; c.fillRect(e.x-14,e.y-17,28*e.hp/e.hp0,3); }
  }
  c.fillStyle = '#ffe14d'; for(const b of SH.bu){ c.beginPath(); c.roundRect(b.x-2,b.y-8,4,12,2); c.fill(); }
  const sx = SH.x, sy = SH.H-40;
  c.fillStyle = '#ff7a2f'; c.beginPath(); c.moveTo(sx-6,sy+16); c.lineTo(sx,sy+26+Math.random()*5); c.lineTo(sx+6,sy+16); c.fill();
  c.fillStyle = '#cfd8ff'; c.beginPath(); c.moveTo(sx,sy-22); c.lineTo(sx+20,sy+16); c.lineTo(sx+8,sy+10); c.lineTo(sx-8,sy+10); c.lineTo(sx-20,sy+16); c.closePath(); c.fill();
  c.fillStyle = '#4aa8ff'; c.beginPath(); c.ellipse(sx,sy-2,5,9,0,0,7); c.fill();
  if(!SH.started && !SH.dead){
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(0,H/2-40,W,70);
    c.fillStyle = '#fff'; c.font = 'bold 20px sans-serif'; c.textAlign = 'center';
    c.fillText(SH.att>1 ? 'Tap to continue' : 'Tap to start', W/2, H/2-10);
    c.font = '13px sans-serif'; c.fillText('Drag your finger to move. Ship fires by itself.', W/2, H/2+14);
  }
}

const QZ = { maxAtt:5, target:10 };
function quizInit(){
  gEl('gCanvas').style.display = 'none';
  gEl('gQuiz').style.display = 'block';
  QZ.score = 0; QZ.att = 1; QZ.asked = 0; QZ.used = {}; QZ.locked = false;
  quizNext();
}
function quizLabel(){ gEl('gScore').textContent = 'Correct '+QZ.score+'/'+QZ.target+' • Attempt '+QZ.att+'/'+QZ.maxAtt; }
function quizPick(){
  const tier = QZ.asked<5 ? 0 : (QZ.asked<10 ? 1 : 2);
  const order = [tier, ...[0,1,2].filter(t=>t!==tier)];
  for(const t of order){
    const free = QZ_BANK[t].map((q,i)=>i).filter(i=>!QZ.used[t+':'+i]);
    if(free.length){ const i = free[Math.floor(Math.random()*free.length)]; QZ.used[t+':'+i] = 1; return {q:QZ_BANK[t][i], tier}; }
  }
  QZ.used = {}; return quizPick();
}
function quizNext(){
  if(!G || G.over) return;
  const p = quizPick(); QZ.asked++;
  const opts = p.q[1].map((t,i)=>({t, ok:i===p.q[2]})).sort(()=>Math.random()-0.5);
  QZ.cur = { opts }; QZ.locked = false;
  QZ.total = [15,12,10][p.tier]; QZ.left = QZ.total;
  gEl('gResult').style.display = 'none';
  quizLabel();
  gEl('gQuiz').innerHTML = '<div style="background:var(--card);border-radius:14px;padding:16px;">'
    + '<div style="color:var(--muted);font-size:12px;">Question '+QZ.asked+' • '+QZ.total+' seconds</div>'
    + '<div style="height:8px;background:rgba(255,255,255,0.12);border-radius:6px;margin:8px 0 14px;overflow:hidden;"><div id="qzBar" style="height:100%;width:100%;background:var(--gold);"></div></div>'
    + '<div style="font-size:18px;font-weight:bold;margin-bottom:14px;">'+esc(p.q[0])+'</div>'
    + opts.map((o,i)=>'<button class="action" id="qzOpt'+i+'" style="margin:0 0 8px;text-align:left;" onclick="quizAnswer('+i+')">'+esc(o.t)+'</button>').join('')
    + '</div>';
  quizTick();
}
function quizTick(){
  if(!G || G.over || QZ.locked) return;
  const bar = gEl('qzBar'); if(bar) bar.style.width = Math.max(0,QZ.left/QZ.total*100)+'%';
  if(QZ.left <= 0){ quizAnswer(-1); return; }
  QZ.left -= 0.1;
  G.timer = setTimeout(quizTick, 100);
}
function quizAnswer(i){
  if(!G || G.over || QZ.locked) return;
  QZ.locked = true; if(G.timer) clearTimeout(G.timer);
  const opts = QZ.cur.opts; const ok = i>=0 && opts[i].ok;
  opts.forEach((o,k)=>{ const b = gEl('qzOpt'+k); if(!b) return; b.disabled = true; if(o.ok){ b.style.background='#2ecc71'; b.style.color='#fff'; } else if(k===i){ b.style.background='#e74c3c'; b.style.color='#fff'; } });
  if(ok){ QZ.score++; quizLabel(); }
  G.timer = setTimeout(()=>{
    if(!G || G.over) return;
    if(ok){ if(QZ.score>=QZ.target) finishGame(QZ.score); else quizNext(); }
    else quizFail(i<0);
  }, 1300);
}
function quizFail(timeout){
  if(QZ.att >= QZ.maxAtt){ finishGame(QZ.score); return; }
  const res = gEl('gResult');
  res.style.display = 'block';
  const left = QZ.maxAtt - QZ.att;
  res.innerHTML = '<div style="font-size:17px;font-weight:bold;">'+(timeout?'Time is up!':'Wrong answer')+'</div>'
    + '<div style="margin:8px 0;color:var(--muted);">Correct so far: <b style="color:#fff;">'+QZ.score+'</b> • '+left+' attempt'+(left>1?'s':'')+' left</div>'
    + '<button class="action btn-collect" onclick="quizContinue()">🎬 Watch ad to continue</button>'
    + '<button class="action" style="margin-top:8px;" onclick="finishGame(QZ.score)">Finish &amp; see result</button>';
}

  gEl('gQuiz').style.display = 'block';
  QZ.att++;
  quizNext();
}

      btns = '<button class="task-btn btn-open" onclick="window.open(\''+t.link+'\',\'_blank\')">🔗 Open</button><button class="task-btn btn-claim" onclick="handleClaimTask('+t.id+','+t.reward+')">🎁 Claim</button>';
    }
    const typeLabel = t.type==='telegram' ? 'Telegram' : 'Social Media';
    return '<div class="task-item"><div class="task-top"><span class="task-title">'+t.title+'</span><span class="task-reward">+'+t.reward+' coins</span></div><div class="task-sub">'+typeLabel+' • '+t.completions_count+'/'+t.max_completions+' claimed</div><div class="task-btn-row">'+btns+'</div></div>';
  }).join('');
}

async function handleClaimTask(taskId, reward){
  if(state.tasksCompleted.includes(taskId)) return;
  try{
    const r = await api('claimTask', { taskId });
    applyServerState(r.state);
  }catch(e){ alert(e.message); }
  render();
  renderTasks();
}

function updateFeePreview(){
  const max = parseInt(document.getElementById('taskMax').value) || 0;
  const feeBox = document.getElementById('taskFeePreview');
  if(!feeBox) return;
  const fee = (0.10*(max/100)).toFixed(2);
  feeBox.textContent = 'Fee for '+max+' completions: $'+fee;
}

async function handleCreateTask(){
  const title = document.getElementById('taskTitle').value.trim();
  const link = document.getElementById('taskLink').value.trim();
  const type = document.getElementById('taskType').value;
  const max = parseInt(document.getElementById('taskMax').value);
  const msg = document.getElementById('taskMsg');
  msg.textContent='';
  msg.className='error-msg';
  if(!title || !link || !max || max<100){ msg.textContent = 'Fill all fields (minimum 100 completions).'; return; }
  let result;
  try{
    result = await api('createTask', { title, link, type, max });
  }catch(e){
    msg.textContent = e.message;
    return;
  }
  document.getElementById('taskTitle').value='';
  document.getElementById('taskLink').value='';
  document.getElementById('taskMax').value='';
  msg.className='success-msg';
  if(result.active){
    msg.textContent = '✅ Task created and is now live!';
  } else {
    const fee = (0.10*(max/100)).toFixed(2);
    msg.textContent = '✅ Submitted! Send $'+fee+' to a wallet below, then message support to activate it.';
  }
  renderTasks();
}

function showTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('btn-'+tab).classList.add('active');
  if(tab==='withdraw'){ renderHistory(); if(IS_OWNER) renderAdminWd(); wdPreview(); }
  if(tab==='tasks'){ renderTasks(); }
  if(tab==='play'){ renderPlay(); }
}

function render(){
  document.getElementById('balanceCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('balanceUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  document.getElementById('profileCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('profileUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  document.getElementById('profileReferrals').textContent = state.referralCount;
  document.getElementById('wdBalance').textContent = state.balance.toLocaleString()+" coins";

  const adsDone = state.slots.reduce((n,sl)=>n+sl.sessions*2,0);
  const dEl = document.getElementById('dailyAds');
  if(dEl) dEl.textContent = 'Ads today: '+adsDone+'/50 • +100 coins per ad';
  const container = document.getElementById('slots');
  container.innerHTML='';
  SLOT_CONFIG.forEach((cfg,i)=>{
    const slot = state.slots[i];
    const div = document.createElement('div');
    div.className='slot';
    const pct = Math.min(100, (slot.sessions/MAX_SESSIONS)*100);
    let btnHtml='';
    if(slot.state==='completed'){
      btnHtml = '<button class="action btn-done" disabled>✅ Done for today (resets 00:00 UTC)</button>';
    } else if(slot.state==='idle'){
      btnHtml = '<button class="action btn-start" onclick="handleStart('+i+')">▶️ Start Mining</button>';
    } else if(slot.state==='mining'){
      const remain = slot.endTime - nowMs();
      if(remain<=0){
        slot.state='ready';
        saveState();
        btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch ad 1 of '+cfg.ads+' to Collect</button>';
      } else {
        btnHtml = '<button class="action btn-wait" disabled>⏳ '+fmtTime(remain)+'</button>';
      }
    } else if(slot.state==='ready'){
      btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch ad 1 of '+cfg.ads+' to Collect</button>';
    } else if(slot.state==='watching'){
      if(slot.busy) btnHtml = '<button class="action btn-wait" disabled>Please wait...</button>';
      else if(slot.adsWatched>=cfg.ads) btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🔄 Try collecting again</button>';
      else btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch ad '+(slot.adsWatched+1)+' of '+cfg.ads+'</button>';
    }
    div.innerHTML = `
      <div class="slot-top">
        <div class="slot-name">${cfg.name}</div>
        <div class="slot-rate">+${cfg.coins} coins / ${cfg.ads} ads</div>
      </div>
      <div class="slot-progress">${slot.sessions}/${MAX_SESSIONS} collects today</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      ${btnHtml}
    `;
    container.appendChild(div);
  });
}

async function startApp(){
  try{
    state = await loadState();
  }catch(e){
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:40px 16px;color:#ff6b6b;">Could not load your data: '+(e && e.message ? e.message : 'unknown error')+'<br><br>Please close and reopen the app from Telegram.</div>';
    return;
  }
  const name = TG_USER ? (TG_USER.first_name||'') + (TG_USER.last_name?(' '+TG_USER.last_name):'') : 'Guest';
  const username = TG_USER && TG_USER.username ? '@'+TG_USER.username : '';
  const photo = TG_USER && TG_USER.photo_url ? '<img src="'+TG_USER.photo_url+'">' : '⛏️';

  const paymentBox = IS_OWNER ? '' : `

      Non-owner task fee: $0.10 per 100 completions.<br>
      <b>USDT (BEP20):</b> ${WALLET_USDT}<br>
      <b>TON:</b> ${WALLET_TON}<br>
      After sending payment, message <a href="${SUPPORT_LINK}" style="color:var(--gold);" target="_blank">support</a> to activate your task.
    </div>
  `;

  document.getElementById('app').innerHTML = `
    <div class="tab-content active" id="tab-mine">
      <h1>⛏️ MineEarn</h1>
      <div class="balance">
        <div class="coins" id="balanceCoins"></div>
        <div class="usd" id="balanceUsd"></div>
      </div>
      <div class="task-sub" id="dailyAds" style="text-align:center;margin-bottom:10px;"></div>
      <div id="slots"></div>
    </div>
    <div class="tab-content" id="tab-play">
      <h1>🎮 Play</h1>
      <div class="task-sub" style="margin-bottom:12px;">5 runs per game each day. Resets at 00:00 UTC. Up to 250 coins per run.</div>
      <div id="playList"></div>
    </div>
    <div class="tab-content" id="tab-tasks">
      <h1>📋 Tasks</h1>
      <div class="section-title">Available Tasks</div>
      <div id="taskList"></div>
      <div class="section-title">Create a Task</div>
      ${paymentBox}
      <div class="form-group">
        <label class="form-label">Task title</label>
        <input type="text" id="taskTitle" class="form-input" placeholder="e.g. Join our channel">
      </div>
      <div class="form-group">
        <label class="form-label">Link</label>
        <input type="text" id="taskLink" class="form-input" placeholder="https://t.me/yourchannel">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="taskType" class="form-input">
          <option value="telegram">Telegram (250 coins)</option>
          <option value="social">Social Media (300 coins)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Number of completions wanted</label>
        <input type="number" id="taskMax" class="form-input" placeholder="e.g. 100" oninput="updateFeePreview()">
        ${IS_OWNER ? '' : '<div class="task-sub" id="taskFeePreview" style="margin-top:6px;"></div>'}
      </div>
      <div class="error-msg" id="taskMsg"></div>
      <button class="action btn-start" onclick="handleCreateTask()">Create Task</button>
    </div>
    <div class="tab-content" id="tab-profile">
      <h1>👤 Profile</h1>
      <div class="profile-card">
        <div class="profile-avatar">${photo}</div>
        <div class="profile-name">${name}</div>
        <div class="profile-username">${username}</div>
        <div class="stat-row"><span class="stat-label">Balance</span><span class="stat-value" id="profileCoins"></span></div>
        <div class="stat-row"><span class="stat-label">USD Value</span><span class="stat-value" id="profileUsd"></span></div>
        <div class="stat-row"><span class="stat-label">Referrals</span><span class="stat-value" id="profileReferrals"></span></div>
        <a class="support-btn" href="${SUPPORT_LINK}" target="_blank">🆘 Contact Support</a>
      </div>
    </div>
    <div class="tab-content" id="tab-withdraw">
      <h1>💸 Withdraw</h1>
      <div class="balance">
        <div class="coins" id="wdBalance"></div>
        <div class="usd">Available balance</div>
      </div>
      <div class="form-group">
        <label class="form-label">Amount (min ${MIN_WITHDRAW.toLocaleString()} coins)</label>
        <input type="number" id="wdAmount" class="form-input" placeholder="e.g. 20000" oninput="wdPreview()">
        <div class="task-sub" id="wdPreview" style="margin-top:6px;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Payout method</label>
        <div class="method-row">
          <div class="method-btn active" id="methodUSDT" onclick="selectMethod('USDT_BEP20')">USDT (BEP20)</div>
          <div class="method-btn" id="methodTON" onclick="selectMethod('TON')">TON</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Wallet address</label>
        <input type="text" id="wdWallet" class="form-input" placeholder="Paste your wallet address">

  `;

  setInterval(render, 1000);
  render();
  renderTasks();
}

async function init(){
  const joined = await checkMembership();
  if(joined){
    startApp();
  } else {
    renderGate();
  }
}
init();

if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
