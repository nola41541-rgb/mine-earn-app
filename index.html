let SPL = { pct:0, t:null };

function fmtTime(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}

// One ad per tap: the user must press "Watch ad" before every single ad (no auto-chaining)
async function handleCollect(i){
  const cfg = SLOT_CONFIG[i];
  const slot = state.slots[i];
  if(slot.busy) return;
  if(slot.state!=='ready' && slot.state!=='watching') return;
  if(slot.state==='ready'){ slot.state='watching'; slot.adsWatched=0; slot.ymids=[]; }
  if(!slot.ymids) slot.ymids = [];
  slot.busy = true; render();
  if(slot.adsWatched < cfg.ads){
    let ymid = null;
    try{ ymid = (await api('adStart')).ymid; }
    catch(e){
      alert(e.message);
      slot.busy = false;
      if(slot.adsWatched===0) slot.state='ready';
      render(); return;
    }
    const watched = await watchAd(ymid);
    if(!watched){ slot.busy = false; render(); return; }
    slot.ymids.push(ymid);
    slot.adsWatched++;
    if(slot.adsWatched < cfg.ads){ slot.busy = false; render(); return; }
  }
  // all required ads watched -> collect (retry while Monetag confirms)
  let done = false, lastErr = '';
  for(let t=0; t<8 && !done; t++){
    try{
      const r = await api('collect', { i, ymids: slot.ymids });
      applyServerState(r.state);
      calibrate(state.slots[i]);
      done = true;
    }catch(e){
      lastErr = e.message;
      if(lastErr.indexOf('not confirmed yet')===-1) break;
      await new Promise(res=>setTimeout(res, 2500));
    }
  }
  const cur = state.slots[i];
  cur.busy = false;
  if(!done){ alert(lastErr); }
  else { cur.ymids = []; }
  render();
}

function snakeSpawn(){

function snakeFood(){

function snakeTurn(x,y){
  if(!G || G.over || G.id!=='snake' || SN.dead) return;
  if(!SN.started){
    if(SN.resumed){

      const N = SN.N, hd = SN.body[0];
      const tx = (hd.x+x+N)%N, ty = (hd.y+y+N)%N;
      const blocked = SN.body.slice(0,-1).some(p=>p.x===tx&&p.y===ty);
      if(blocked) return;
    } else if(x===-SN.dir.x && y===-SN.dir.y){

      SN.body.reverse();
    }
    SN.dir = {x,y}; SN.next = {x,y};
    SN.started = true;

    return;
  }

}
function snakeStep(){
  if(!G || G.over || G.id!=='snake' || SN.dead) return;
  SN.dir = SN.next;

  const h = { x:(SN.body[0].x+SN.dir.x+N)%N, y:(SN.body[0].y+SN.dir.y+N)%N };
  const ate = h.x===SN.food.x && h.y===SN.food.y;
  const tail = ate ? SN.body : SN.body.slice(0,-1);
  if(tail.some(p=>p.x===h.x&&p.y===h.y)){ snakeDie(); return; }
  SN.body.unshift(h);
  if(ate){
    SN.score++;
    snakeLabel();
    if(SN.body.length >= SN.N*SN.N - 1){ snakeDraw(); finishGame(SN.score); return; }
    SN.food = snakeFood();
  } else SN.body.pop();
  snakeDraw();
  const delay = Math.max(120, 260 - SN.score*5);
  G.timer = setTimeout(snakeStep, delay);
}

const RN = { maxAtt:5, W:360, H:340 };
function runnerInit(){
  const cv = gEl('gCanvas');

function runnerStart(){

  RN.started = true; RN.last = Date.now(); runnerLoop(); return true;
}
function runnerMove(dir, act){
  if(!G || G.over || G.id!=='runner' || RN.dead) return;
  if(!RN.started){ runnerStart(); }
  if(act==='jump'){ if(RN.h===0){ RN.vy = 6.2; } }
  else if(act==='slide'){ RN.slide = 0.7; if(RN.h>0) RN.vy = -10; }
  else if(dir){ RN.lane = Math.max(-1, Math.min(1, RN.lane+dir)); }
}
function runnerLoop(){
  if(!G || G.over || RN.dead) return;
  const now = Date.now(); let dt = (now - RN.last)/1000; RN.last = now;
  if(dt > 0.05) dt = 0.05;
  RN.speed = Math.min(30, RN.speed + 0.25*dt);
  RN.dist += RN.speed*dt;
  const sc = Math.floor(RN.dist*0.6);
  if(sc !== RN.score){ RN.score = sc; runnerLabel(); }
  // player
  RN.x += (RN.lane - RN.x)*Math.min(1, dt*14);
  RN.dust += dt;
  if(RN.onGround && RN.h===0 && RN.dust > 0.05){ RN.dust = 0; RN.parts.push({x:RN.W/2+RN.x*RN.laneW+(Math.random()-0.5)*14, y:RN.py+1, vx:(Math.random()-0.5)*30, vy:-15-Math.random()*25, life:0.45, t:0, c:'rgba(235,225,205,1)', r:3, dust:true}); }
  for(const p of RN.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; if(!p.dust) p.vy += 420*dt; }
  RN.parts = RN.parts.filter(p=>p.t<p.life);
  if(RN.h>0 || RN.vy>0){ RN.vy -= 20*dt; RN.h += RN.vy*dt; if(RN.h<=0){ RN.h = 0; RN.vy = 0; } }
  if(RN.slide>0) RN.slide -= dt;
  // obstacles
  for(const o of RN.obs) o.z -= RN.speed*dt;
  RN.obs = RN.obs.filter(o=>o.z > -3);
  RN.nextZ -= RN.speed*dt;
  if(RN.nextZ <= 0){
    // a row: never block every lane with something that can't be jumped or slid
    const lanes = [-1,0,1].sort(()=>Math.random()-0.5);
    const count = RN.speed>20 && Math.random()<0.5 ? 2 : 1;
    let blocks = 0;
    for(let i=0;i<count;i++){
      let type = ['low','high','block'][Math.floor(Math.random()*3)];
      if(type==='block'){ if(blocks>=1 && count===2) type='low'; else blocks++; }
      RN.obs.push({z:60, lane:lanes[i], type});
    }
    RN.nextZ = RN.speed*0.95 + 9 + Math.random()*6;
  }
  // collision
  for(const o of RN.obs){
    if(o.z > 0.8 || o.z < -0.9) continue;
    if(Math.abs(RN.x - o.lane) > 0.55) continue;
    if(o.type==='block' || (o.type==='low' && RN.h < 0.55) || (o.type==='high' && RN.slide<=0)){ runnerDie(); return; }
  }
  runnerDraw();
  G.timer = setTimeout(runnerLoop, 16);
}

function rnLimb(c, x0,y0, x1,y1, x2,y2, w0,w1,w2, c0, c1){

// ---- Galaxy Blaster (drag to move, auto-fire, 5 attempts per play) ----
const SH = { maxAtt:5, W:360, H:440, move:0 };

function shooterLabel(){ gEl('gScore').textContent = 'Score '+SH.score+' • ≈'+Math.min(250,SH.score*5)+' coins'; checkCap(SH.score); }
function shooterSpawn(){
  SH.x = SH.W/2; SH.en = []; SH.bu = []; SH.eb = []; SH.caps = []; SH.parts = []; SH.pops = [];
  SH.fire = 0; SH.spawn = 1.0; SH.move = 0; SH.power = 0;

  shooterLabel(); shooterDraw();
}
function shooterStart(){
  if(!G || G.over || G.id!=='shooter' || SH.dead || SH.started) return;
  SH.started = true; SH.last = Date.now(); shooterLoop();
}
function shooterPress(d){ shooterStart(); SH.move = d; }
function shBoom(x,y,col,n,big){
  for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=50+Math.random()*(big?260:190); SH.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.5+Math.random()*0.5,t:0,c:col[i%col.length],r:1.5+Math.random()*(big?4:3)}); }
  for(let i=0;i<(big?9:5);i++){ const a=Math.random()*6.283, v=40+Math.random()*130; SH.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.8+Math.random()*0.5,t:0,c:['#8b93ad','#c0c7dd','#ff7a2f'][i%3],r:2+Math.random()*3,deb:true,rot:Math.random()*6,spin:(Math.random()-0.5)*14}); }
  SH.parts.push({x,y,vx:0,vy:0,life:big?0.55:0.4,t:0,c:'#fff',r:big?14:8,ring:true,big});
  SH.shake = Math.max(SH.shake||0, big?1:0.25);

function shooterLoop(){
  if(!G || G.over || SH.dead) return;
  const now = Date.now(); let dt = (now - SH.last)/1000; SH.last = now; if(dt>0.05) dt = 0.05;
  SH.t += dt;
  SH.x = Math.max(24, Math.min(SH.W-24, SH.x + SH.move*320*dt));
  const sy = SH.H-50;
  // auto fire (twin guns; triple spread with power-up)
  SH.fire -= dt; if(SH.power>0) SH.power -= dt;
  if(SH.fire <= 0){
    if(SH.power>0){ for(const a of [-0.22,0,0.22]) SH.bu.push({x:SH.x,y:sy-24,vx:Math.sin(a)*620,vy:-Math.cos(a)*620}); }
    else { SH.bu.push({x:SH.x-9,y:sy-14,vx:0,vy:-640}); SH.bu.push({x:SH.x+9,y:sy-14,vx:0,vy:-640}); }
    SH.fire = 0.28;
  }
  for(const b of SH.bu){ b.x += b.vx*dt; b.y += b.vy*dt; }
  SH.bu = SH.bu.filter(b=>b.y>-20 && b.x>-10 && b.x<SH.W+10);
  // spawn: easy at the start, then faster, tougher and mixed
  SH.spawn -= dt;
  if(SH.spawn <= 0){
    const s = SH.score, r = Math.random(); let e;
    if(s>=10 && r<0.2){ const hp = s>=30?3:2; e = {k:'turret',x:30+Math.random()*(SH.W-60),y:-30,hp,hp0:hp,sp:38}; }
    else if(s>=5 && r<0.45){ e = {k:'dart',x:20+Math.random()*(SH.W-40),y:-20,hp:1,hp0:1,sp:150+Math.min(40,s)}; }
    else { e = {k:'fighter',x:30+Math.random()*(SH.W-60),y:-20,hp:1,hp0:1,sp:52+Math.min(s,50)*1.3,ph:Math.random()*6,shoot:(s>=8&&Math.random()<0.35)?1.5+Math.random()*2:0}; e.bx = e.x; }
    SH.en.push(e);
    SH.spawn = Math.max(0.6, 1.4 - s*0.013);
  }
  SH.shake = Math.max(0,(SH.shake||0)-dt*2.6);
  for(const e of SH.en){ if(e.flash>0) e.flash -= dt; }
  for(const e of SH.en){
    e.y += e.sp*dt;
    if(e.k==='fighter'){ e.x = e.bx + Math.sin(SH.t*1.6+e.ph)*26; if(e.shoot){ e.shoot -= dt; if(e.shoot<=0 && e.y>20 && e.y<SH.H-160){ SH.eb.push({x:e.x,y:e.y+16,vy:200}); e.shoot = 2+Math.random()*2; } } }
  }
  for(const b of SH.eb) b.y += b.vy*dt;
  SH.eb = SH.eb.filter(b=>b.y<SH.H+10);
  // bullets vs enemies
  for(const b of SH.bu){ for(const e of SH.en){
    const rr = e.k==='turret'?22:(e.k==='dart'?14:18);
    if(e.hp>0 && Math.abs(b.x-e.x)<rr && Math.abs(b.y-e.y)<rr){
      e.hp--; b.y = -99; e.flash = 0.07;
      if(e.hp<=0){
        SH.score++; shooterLabel();
        shBoom(e.x,e.y, e.k==='turret'?['#c9a6ff','#ff9f1a','#fff']:['#ffb347','#ff5a36','#ffe14d'], e.k==='turret'?30:18, e.k==='turret');
        SH.pops.push({x:e.x,y:e.y,t:0,text:'+5'});
        if(Math.random()<0.12) SH.caps.push({x:e.x,y:e.y});
      } else SH.parts.push({x:b.x,y:b.y,vx:0,vy:0,life:0.15,t:0,c:'#fff',r:5,ring:true});

  for(const c of SH.caps){ if(Math.abs(c.x-SH.x)<26 && Math.abs(c.y-sy)<28){ c.y = 9999; SH.power = 8; SH.pops.push({x:SH.x,y:sy-40,t:0,text:'TRIPLE SHOT!'}); } }
  SH.caps = SH.caps.filter(c=>c.y<SH.H+20);
  // particles, popups, stars
  for(const p of SH.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.96; p.vy *= 0.96; }

  for(const p of SH.pops){ p.t += dt; p.y -= 40*dt; }
  SH.pops = SH.pops.filter(p=>p.t<0.9);
  for(const s of SH.stars){ s.y += s.s*260*dt; if(s.y>SH.H){ s.y=-10; s.x=Math.random()*SH.W; } }
  // ship hit / enemy through / pink orb
  for(const e of SH.en){ if(e.y > SH.H-18 || (Math.abs(e.x-SH.x)<26 && Math.abs(e.y-sy)<26)){ shBoom(SH.x,sy,['#ffb347','#fff','#4aa8ff','#ff5a36'],34,true); shooterDie(); return; } }
  for(const b of SH.eb){ if(Math.abs(b.x-SH.x)<16 && Math.abs(b.y-sy)<22){ shBoom(SH.x,sy,['#ffb347','#fff','#4aa8ff','#ff5a36'],34,true); shooterDie(); return; } }

function shFx(){
  if(!G || G.over || G.id!=='shooter') return;

  SH.parts = SH.parts.filter(p=>p.t<p.life);
  for(const s of SH.stars){ s.y += s.s*120*dt; if(s.y>SH.H){ s.y=-10; s.x=Math.random()*SH.W; } }

    } else { c.globalAlpha = a; c.fillStyle = p.c; c.beginPath(); c.arc(p.x,p.y,p.r*a+0.4,0,7); c.fill(); c.globalAlpha = 1; shGlow(c,p.x,p.y,p.r*3,'rgba(255,170,70,A)',a*0.5); }
  }
  c.globalCompositeOperation = 'source-over';
  c.textAlign = 'center'; c.font = 'bold 16px sans-serif';

  c.restore();
  // vignette
  const vg = c.createRadialGradient(W/2,H*0.55,H*0.35,W/2,H*0.55,H*0.85); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,20,0.5)');
  c.fillStyle = vg; c.fillRect(0,0,W,H);
  // HUD
  const wave = 1 + Math.floor(SH.score/10);
  c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.roundRect(8,8,64,26,13); c.fill();
  c.fillStyle = '#fff'; c.font = 'bold 14px sans-serif'; c.textAlign = 'center'; c.fillText('Wave '+wave, 40, 26);

  if(!SH.started && !SH.dead){

function mathQ(tier){
  const r = n=>Math.floor(Math.random()*n), R = (a,b)=>a+r(b-a+1);
  let text, ans, near = [];
  const kind = tier===0 ? r(2) : (tier===1 ? 2+r(2) : r(5));
  if(kind===0){ const a=R(3,30), b=R(3,30); text = a+' + '+b; ans = a+b; }
  else if(kind===1){ let a=R(10,40), b=R(3,25); if(b>a){ const t=a; a=b; b=t; } text = a+' − '+b; ans = a-b; }
  else if(kind===2){ const a=tier===1?R(2,12):R(12,25), b=tier===1?R(2,12):R(3,9); text = a+' × '+b; ans = a*b; near = [ans+a, ans-a, ans+b, ans-b]; }
  else if(kind===3){ const b=tier===1?R(2,12):R(3,15), q=tier===1?R(2,12):R(5,25); text = (b*q)+' ÷ '+b; ans = q; near = [q+1, q-1, q+2, q-2]; }
  else if(tier===2 && Math.random()<0.5){ const a=R(3,9), b=R(3,9), c=R(5,30); text = a+' × '+b+' + '+c; ans = a*b+c; near = [a*b-c, a*b+c+a, a*b+c-b]; }
  else { const a=R(100,500), b=R(100,400); if(Math.random()<0.5){ text = a+' + '+b; ans = a+b; } else { const hi=Math.max(a,b), lo=Math.min(a,b); text = hi+' − '+lo; ans = hi-lo; } }
  const set = [ans];
  for(const n of near){ if(n>=0 && !set.includes(n) && set.length<4) set.push(n); }
  const offs = [1,-1,2,-2,10,-10,5,-5,3,-3,20,-20];
  for(const o of offs.sort(()=>Math.random()-0.5)){ const v = ans+o; if(v>=0 && !set.includes(v) && set.length<4) set.push(v); }
  return ['What is '+text+' ?', set.map(String), 0];
}
const QZ = { maxAtt:5, target:10 };
function quizInit(){
  gEl('gCanvas').style.display = 'none';
  gEl('gQuiz').style.display = 'block';
  QZ.score = 0; QZ.att = 1; QZ.asked = 0; QZ.used = {}; QZ.locked = false;
  quizNext();
}
function quizLabel(){ gEl('gScore').textContent = 'Correct '+QZ.score+' • Attempt '+QZ.att+'/'+QZ.maxAtt; checkCap(QZ.score); }
function quizPick(){
  const tier = QZ.asked<5 ? 0 : (QZ.asked<10 ? 1 : 2);
  if(Math.random()<0.5) return {q:mathQ(tier), tier, math:true};
  const order = [tier, ...[0,1,2].filter(t=>t!==tier)];
  for(const t of order){
    const free = QZ_BANK[t].map((q,i)=>i).filter(i=>!QZ.used[t+':'+i]);
    if(free.length){ const i = free[Math.floor(Math.random()*free.length)]; QZ.used[t+':'+i] = 1; return {q:QZ_BANK[t][i], tier, math:false}; }
  }
  QZ.used = {}; return {q:mathQ(tier), tier, math:true};
}
function quizNext(){
  if(!G || G.over) return;
  const p = quizPick(); QZ.asked++;
  const opts = p.q[1].map((t,i)=>({t, ok:i===p.q[2]})).sort(()=>Math.random()-0.5);
  QZ.cur = { opts }; QZ.locked = false;
  QZ.total = p.math ? [10,12,15][p.tier] : [15,12,10][p.tier]; QZ.left = QZ.total;
  gEl('gResult').style.display = 'none';
  quizLabel();
  gEl('gQuiz').innerHTML = '<div style="background:var(--card);border-radius:14px;padding:16px;">'
    + '<div style="color:var(--muted);font-size:12px;">Question '+QZ.asked+' • '+(p.math?'Maths':'General knowledge')+' • '+QZ.total+' seconds</div>'
    + '<div style="height:8px;background:rgba(255,255,255,0.12);border-radius:6px;margin:8px 0 14px;overflow:hidden;"><div id="qzBar" style="height:100%;width:100%;background:var(--gold);"></div></div>'
    + '<div style="font-size:'+(p.math?'24':'18')+'px;font-weight:bold;margin-bottom:14px;">'+esc(p.q[0])+'</div>'
    + opts.map((o,i)=>'<button class="action" id="qzOpt'+i+'" style="margin:0 0 8px;text-align:left;" onclick="quizAnswer('+i+')">'+esc(o.t)+'</button>').join('')
    + '</div>';
  quizTick();
}
function quizTick(){
  if(!G || G.over || QZ.locked) return;
  const bar = gEl('qzBar'); if(bar) bar.style.width = Math.max(0,QZ.left/QZ.total*100)+'%';
  if(QZ.left <= 0){ quizAnswer(-1); return; }
  QZ.left -= 0.1;
  G.timer = setTimeout(quizTick, 100);
}
function quizAnswer(i){
  if(!G || G.over || QZ.locked) return;
  QZ.locked = true; if(G.timer) clearTimeout(G.timer);
  const opts = QZ.cur.opts; const ok = i>=0 && opts[i].ok;
  opts.forEach((o,k)=>{ const b = gEl('qzOpt'+k); if(!b) return; b.disabled = true; if(o.ok){ b.style.background='#2ecc71'; b.style.color='#fff'; } else if(k===i){ b.style.background='#e74c3c'; b.style.color='#fff'; } });
  if(ok){ QZ.score++; quizLabel(); }
  G.timer = setTimeout(()=>{
    if(!G || G.over) return;
    if(ok) quizNext(); else quizFail(i<0);
  }, 1300);
}
function quizFail(timeout){
  if(QZ.att >= QZ.maxAtt){ finishGame(QZ.score); return; }
  const res = gEl('gResult');
  res.style.display = 'block';
  const left = QZ.maxAtt - QZ.att;
  res.innerHTML = '<div style="font-size:17px;font-weight:bold;">'+(timeout?'Time is up!':'Wrong answer')+'</div>'
    + '<div style="margin:8px 0;color:var(--muted);">Correct so far: <b style="color:#fff;">'+QZ.score+'</b> • '+left+' attempt'+(left>1?'s':'')+' left</div>'
    + '<button class="action btn-collect" onclick="quizContinue()">🎬 Watch ad to continue</button>'
    + '<button class="action" style="margin-top:8px;" onclick="finishGame(QZ.score)">Finish &amp; see result</button>';
}

}

function tkAdPlaceholder(id){
  const a = DAILY_ADS.find(x=>x.id===id); if(!a) return;
  const n = tkGet(id); if(n >= a.max) return;
  let box = document.getElementById('tkAdBox');
  if(!box){ box = document.createElement('div'); box.id = 'tkAdBox'; box.className = 'modal'; box.innerHTML = '<div class="modal-box" id="tkAdInner"></div>'; document.body.appendChild(box); }
  box.style.display = 'flex';
  const inner = document.getElementById('tkAdInner');
  let s = 3;
  const draw = ()=>{ inner.innerHTML = '<div style="color:var(--muted);font-size:12px;">AD PLACEHOLDER (TEST) • '+a.name+'</div><div style="font-size:44px;font-weight:800;color:var(--gold);margin:12px 0;">'+s+'</div><div style="color:var(--muted);font-size:13px;">Please wait...</div>'; };
  draw();
  const t = setInterval(()=>{
    s--;
    if(s<=0){ clearInterval(t); tkSet(id, n+1); box.style.display='none'; renderTasks(); }
    else draw();
  }, 1000);
}
async function renderTasks(){
  const container = document.getElementById('taskList');
  if(!container) return;
  document.querySelectorAll('.tk-cat').forEach(b=>b.classList.toggle('active', b.dataset.c===TK.cat));
  document.getElementById('tkViewAll').classList.toggle('active', TK.view==='all');
  document.getElementById('tkViewMine').classList.toggle('active', TK.view==='mine');
  const pending = DAILY_ADS.reduce((n,a)=>n+(tkGet(a.id)<a.max?1:0),0);
  const dot = document.getElementById('tkDailyDot'); if(dot) dot.style.display = pending ? 'block' : 'none';
  const nb = document.getElementById('tkNewBtn'); if(nb) nb.style.display = (IS_OWNER || TK.cat==='exclusive') ? 'block' : 'none';
  const cnt = document.getElementById('tkCount');
  if(TK.cat==='daily' && TK.view==='all'){
    cnt.textContent = 'Resets every day at 00:00 UTC';
    const adsDone = state.slots.reduce((n,sl)=>n+sl.sessions*2,0);
    let h = '<div class="tk-card" style="border-left-color:#2f7bff;">'+tkRing(adsDone,50)+'<div class="tk-main"><div class="tk-title">Mining ads</div><div class="tk-meta">50 coins per ad • 50 ads a day</div><div class="tk-actions"><button class="tk-btn f" onclick="showTab(\'mine\')">Go to Mine</button></div></div></div>';
    h += DAILY_ADS.map(a=>{
      const n = tkGet(a.id), full = n>=a.max;
      return '<div class="tk-card'+(full?' done':'')+'" style="border-left-color:'+a.color+';">'+tkRing(n,a.max)+'<div class="tk-main"><div class="tk-title">'+a.name+'<span class="tk-test">TEST AD</span></div><div class="tk-meta">'+a.per+' coins per ad • '+a.max+' ads a day</div><div class="tk-actions">'
        + (full ? '<button class="tk-btn d" disabled>✓ Done today</button>' : '<button class="tk-btn f" onclick="tkAdPlaceholder(\''+a.id+'\')">▶ Watch ad '+(n+1)+'</button>')
        + '</div></div></div>';
    }).join('');
    h += '<div class="tk-empty" style="padding:14px;font-size:12px;">These are test ads. Coin rewards for them switch on once the ad networks approve the app.</div>';
    container.innerHTML = h;
    return;
  }
  const rows = await loadTasks();
  const catOf = t => t.category || 'social';
  let list;
  if(TK.view==='mine'){
    list = rows.filter(t=>state.tasksCompleted.includes(t.id));
    cnt.textContent = list.length+' completed';
  } else {
    list = rows.filter(t=>catOf(t)===TK.cat);
    const doneN = list.filter(t=>state.tasksCompleted.includes(t.id)).length;
    cnt.textContent = doneN+'/'+list.length+' done';
  }
  if(list.length===0){
    const msg = TK.view==='mine' ? 'You have not completed any tasks yet.' : (TK.cat==='social' ? 'No tasks available right now.' : 'Nothing here yet. New tasks will appear soon.');
    container.innerHTML = '<div class="tk-empty">'+msg+'</div>';
    return;
  }
  container.innerHTML = list.map(t=>{
    const done = state.tasksCompleted.includes(t.id);
    const full = t.completions_count >= t.max_completions;
    let btns;
    if(done) btns = '<button class="tk-btn d" disabled>✓ Completed</button>';
    else if(full) btns = '<button class="tk-btn d" style="color:var(--muted);background:var(--card2);" disabled>Full</button>';
    else {
      const o = tkOpened[t.id]; const left = o ? Math.ceil(TK_WAIT - (Date.now()-o)/1000) : null;
      const claimBtn = !o ? '<button class="tk-btn d" style="color:var(--muted);background:var(--card2);" disabled>Open first</button>'
        : (left>0 ? '<button class="tk-btn d" style="color:var(--muted);background:var(--card2);" disabled>Wait '+left+'s</button>'
        : '<button class="tk-btn f" onclick="handleClaimTask('+t.id+','+t.reward+')">Claim</button>');
      btns = '<button class="tk-btn o" onclick="tkOpen('+t.id+',\''+esc(t.link)+'\')">Open ↗</button>'+claimBtn;
    }
    const typeLabel = t.type==='telegram' ? 'Telegram' : 'Social media';
    return '<div class="tk-card'+(done?' done':'')+'"><div class="tk-badge"><span class="coin"></span><b>+'+t.reward+'</b><small>COINS</small></div><div class="tk-main"><div class="tk-title">'+esc(t.title)+'</div><div class="tk-meta">'+typeLabel+' • '+t.completions_count+'/'+t.max_completions+' claimed</div><div class="tk-actions">'+btns+'</div></div></div>';
  }).join('');
}

async function handleClaimTask(taskId, reward){
  if(state.tasksCompleted.includes(taskId)) return;
  try{
    const r = await api('taskClaim', { taskId }, TASK_URL);
    state.balance = r.balance;
    state.tasksCompleted = r.tasksCompleted;
  }catch(e){ alert(e.message); }
  render();
  renderTasks();
}

function contactSupportTask(){
  const title = document.getElementById('taskTitle').value.trim();
  const link = document.getElementById('taskLink').value.trim();
  const type = document.getElementById('taskType').value;
  const max = parseInt(document.getElementById('taskMax').value);
  const msg = document.getElementById('taskMsg');
  msg.className = 'error-msg';
  if(!title || !link || !max || max<100){ msg.textContent = 'Fill all fields (minimum 100 users).'; return; }
  if(!/^https:\/\/\S{3,200}$/.test(link)){ msg.textContent = 'Link must start with https://'; return; }
  msg.textContent = '';
  const fee = (0.10*(max/100)).toFixed(2);
  const text = 'Hello, I want to create a task on MineEarn.\n\nTask name: '+title+'\nLink: '+link+'\nType: '+(type==='telegram'?'Telegram':'Social media')+'\nMaximum users: '+max+'\nMy Telegram ID: '+TG_ID+'\n\nPlease tell me how to pay the $'+fee+' fee.';
  const url = SUPPORT_LINK + '?text=' + encodeURIComponent(text);
  try{ window.Telegram.WebApp.openTelegramLink(url); }catch(e){ window.open(url, '_blank'); }
}
async function handleCreateTask(){
  const title = document.getElementById('taskTitle').value.trim();
  const link = document.getElementById('taskLink').value.trim();
  const type = document.getElementById('taskType').value;
  const max = parseInt(document.getElementById('taskMax').value);
  const msg = document.getElementById('taskMsg');
  msg.textContent='';
  msg.className='error-msg';
  if(!title || !link || !max || max<1){ msg.textContent = 'Fill all fields.'; return; }
  let result;
  try{
    result = await api('adminCreate', { title, link, type, max, category: (document.getElementById('taskCat')||{}).value || 'exclusive' }, TASK_URL);
  }catch(e){
    msg.textContent = e.message;
    return;
  }
  document.getElementById('taskTitle').value='';
  document.getElementById('taskLink').value='';
  document.getElementById('taskMax').value='';
  msg.className='success-msg';
  msg.textContent = '✅ Task created and is now live!';
  renderTasks();
}

function showTab(tab){
  if(tab==='withdraw') tab = 'profile';
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('btn-'+tab).classList.add('active');
  window.scrollTo(0,0);
  if(tab==='profile'){ renderHistory(); if(IS_OWNER) renderAdminWd(); wdPreview(); }
  if(tab==='tasks'){ renderTasks(); }

  if(tab==='home'){ renderHome(); }
}

function copyRef(){
  const link = myRefLink();
  const done = ()=>{ const b = document.getElementById('refCopyBtn'); if(b){ b.textContent = '✅ Copied!'; setTimeout(()=>{ b.textContent = '📋 Copy link'; }, 1800); } };
  try{ navigator.clipboard.writeText(link).then(done, ()=>fallbackCopy(link, done)); }catch(e){ fallbackCopy(link, done); }
}
function fallbackCopy(text, done){
  const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); done(); }catch(e){ alert(text); }
  document.body.removeChild(t);
}
function shareRef(){

  try{ window.Telegram.WebApp.openTelegramLink(url); }catch(e){ window.open(url, '_blank'); }
}
async function refJoinOnce(){
  try{
    const sp = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.start_param;
    if(!sp || !/^[0-9]{5,15}$/.test(sp) || sp === TG_ID) return;
    if(localStorage.getItem('refTried:'+TG_ID) === sp) return;
    await api('refJoin', { code: sp }, REF_URL);
    localStorage.setItem('refTried:'+TG_ID, sp);
  }catch(e){}
}

function render(){
  document.getElementById('balanceCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('balanceUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  const hc = document.getElementById('homeCoins'); if(hc){ hc.textContent = state.balance.toLocaleString()+' coins'; document.getElementById('homeUsd').textContent = '≈ $'+(state.balance*RATE).toFixed(5); document.getElementById('homeRefs').textContent = state.referralCount; document.getElementById('homeAds').textContent = state.slots.reduce((n,sl)=>n+sl.sessions*2,0)+'/50'; }
  document.getElementById('profileCoins').textContent = state.balance.toLocaleString()+" coins";
  document.getElementById('profileUsd').textContent = "≈ $"+(state.balance*RATE).toFixed(5);
  document.getElementById('profileReferrals').textContent = state.referralCount;
  document.getElementById('wdBalance').textContent = state.balance.toLocaleString()+" coins";

  const adsDone = state.slots.reduce((n,sl)=>n+sl.sessions*2,0);
  const dEl = document.getElementById('dailyAds');
  if(dEl) dEl.textContent = 'Ads today: '+adsDone+'/50 • +50 coins per ad';
  const container = document.getElementById('slots');
  container.innerHTML='';
  SLOT_CONFIG.forEach((cfg,i)=>{
    const slot = state.slots[i];
    const div = document.createElement('div');
    div.className='slot';
    const pct = Math.min(100, (slot.sessions/MAX_SESSIONS)*100);
    let btnHtml='';
    if(slot.state==='completed'){
      btnHtml = '<button class="action btn-done" disabled>✅ Done for today (resets 00:00 UTC)</button>';
    } else if(slot.state==='idle'){
      btnHtml = '<button class="action btn-start" onclick="handleStart('+i+')">▶️ Start Mining</button>';
    } else if(slot.state==='mining'){
      const remain = slot.endTime - nowMs();
      if(remain<=0){
        slot.state='ready';
        saveState();
        btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch ad 1 of '+cfg.ads+' to Collect</button>';
      } else {
        btnHtml = '<button class="action btn-wait" disabled>⏳ '+fmtTime(remain)+'</button>';
      }
    } else if(slot.state==='ready'){
      btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch ad 1 of '+cfg.ads+' to Collect</button>';
    } else if(slot.state==='watching'){
      if(slot.busy) btnHtml = '<button class="action btn-wait" disabled>Please wait...</button>';
      else if(slot.adsWatched>=cfg.ads) btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🔄 Try collecting again</button>';
      else btnHtml = '<button class="action btn-collect" onclick="handleCollect('+i+')">🎬 Watch ad '+(slot.adsWatched+1)+' of '+cfg.ads+'</button>';
    }
    div.innerHTML = `
      <div class="slot-top">
        <div class="slot-name"><span class="slot-badge">${i+1}</span>${cfg.name}</div>
        <div class="slot-rate">+${cfg.coins} coins / ${cfg.ads} ads</div>
      </div>
      <div class="slot-progress">${slot.sessions}/${MAX_SESSIONS} collects today</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      ${btnHtml}
    `;
    container.appendChild(div);
  });
}

        <div class="profile-name">${name}</div>
        <div class="profile-username">${username}</div>
        <div class="stat-row"><span class="stat-label">Balance</span><span class="stat-value" id="profileCoins"></span></div>
        <div class="stat-row"><span class="stat-label">USD Value</span><span class="stat-value" id="profileUsd"></span></div>
        <div class="stat-row"><span class="stat-label">Referrals</span><span class="stat-value" id="profileReferrals"></span></div>
        <a class="support-btn" href="${SUPPORT_LINK}" target="_blank">🆘 Contact Support</a>
      </div>
      <h1 id="wdSection" style="margin-top:24px;">Withdraw</h1>
      <div class="balance">
        <div class="coins" id="wdBalance"></div>
        <div class="usd">Available balance</div>
      </div>
      <div class="form-group">
        <label class="form-label">Amount (min ${MIN_WITHDRAW.toLocaleString()} coins)</label>
        <input type="number" id="wdAmount" class="form-input" placeholder="e.g. 20000" oninput="wdPreview()">
        <div class="task-sub" id="wdPreview" style="margin-top:6px;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Payout method</label>
        <div class="method-row">
          <div class="method-btn active" id="methodUSDT" onclick="selectMethod('USDT_BEP20')">USDT (BEP20)</div>
          <div class="method-btn" id="methodTON" onclick="selectMethod('TON')">TON</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Wallet address</label>
        <input type="text" id="wdWallet" class="form-input" placeholder="Paste your wallet address">
      </div>
      <div class="error-msg" id="wdMessage"></div>
      <button class="action btn-start" onclick="handleWithdraw()">Request Withdrawal</button>
      <div class="section-title">History</div>
      <div id="wdHistory"></div>
      ${IS_OWNER ? '<div class="section-title">Admin: withdrawal requests</div><div id="adminWd"></div>' : ''}
    </div>
  `;
  document.getElementById('tabbar').style.display='flex';
  refJoinOnce().then(()=>{ renderHome(); });
  setInterval(render, 1000);
  render();
  renderTasks();
}

async function init(){
  const joined = await checkMembership();
  if(joined){
    startApp();
  } else {
    await splashFinish();
    renderGate();
  }
}
init();

if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
